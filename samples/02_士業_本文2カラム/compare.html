<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプル法律事務所 — デザインラフ比較（3案）</title>
<!--
  比較ハブ（compare.html）。**このファイルは生成しない**（KLK-103）。
  draft-gen/compare_template.html を draft-gen/make_compare.py が埋めて書き出す。

  ★なぜ生成をやめたか: この JS（約160行）はデザインではなく道具立てで、
    どの生成物でも中身は同じ。にもかかわらず毎回書き起こさせていたため、
    KLK-079/080/081/092 で積み上げた振る舞いが**作り直しのたびに落ちた**
    （2026-09-07 の見本作り直しで6項目中4項目が欠落・KLK-102）。
    固定テンプレートにすれば、その種の欠落が構造的に起きない。

  可変部はこれだけ（※二重波括弧で囲んだ名前。ここでは囲まずに列挙する。
  囲むと、この説明文まで置換されてしまう＝実際にそうなった）:
    PROJECT / DATE / VARIANT_COUNT / TITLE_SUFFIX
    INDUSTRY / COLUMNS / TASTE / ATARI
    MAIN / SUB / ACCENT / BG
    FOLDER / VARIANTS（1 or 3）
  繰り返し部（RADIOS / SEG / THUMBSTRIP / PRINT_BUTTONS / PANES）は
  make_compare.py が案の数だけ展開する。
-->
<style>
:root{ --c-main:#2a3c6b; --c-sub:#1d2a4d; --c-accent:#b08d4f; --c-bg:#f6f7fa; }
  /* ↑ 案件の配色。ここだけが案件ごとに変わる（KLK-103） */
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
        background:#eceae4; color:#2c2c2c; }

  /* 隠しラジオ（案切替・幅切替とも CSS-only） */
  .vswitch, .vwswitch{ position:absolute; opacity:0; pointer-events:none; }

  /* toolchrome */
  .toolchrome{ background:#fff; border-bottom:1px solid #e0ddd4; padding:18px 26px; }
  .proj-head{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .proj-head .proj-name{ font-size:20px; font-weight:800; letter-spacing:.03em; }
  .proj-head .proj-meta{ font-size:12px; color:#8a8578; }
  .settings-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip{ background:#f2f0ea; border:1px solid #e2dfd6; border-radius:16px; padding:4px 12px; font-size:12px; color:#5b564a; }
  .chip b{ color:var(--c-main); font-weight:700; }
  .chip .sw{ display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle;
    margin-right:5px; border:1px solid rgba(0,0,0,.15); }

  /* variant-bar */
  .variant-bar{ display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    background:#fff; border-bottom:1px solid #e0ddd4; padding:14px 26px; }
  .seg{ display:flex; gap:6px; }
  .seg label{ cursor:pointer; font-size:13px; font-weight:700; color:#6b6558; padding:8px 18px;
    border:1px solid #ddd9cf; border-radius:20px; background:#faf9f5; }
  .vwseg{ display:flex; gap:6px; margin-left:auto; }
  .vwseg label{ cursor:pointer; font-size:12px; font-weight:600; color:#6b6558; padding:7px 14px;
    border:1px solid #ddd9cf; border-radius:16px; background:#faf9f5; }

  .thumbstrip{ display:flex; gap:12px; }
  .vthumb{ width:96px; cursor:pointer; }
  .vthumb .mini{ height:60px; border-radius:6px; border:2px solid transparent; overflow:hidden;
    display:flex; flex-direction:column; }
  .vthumb .mini .bar{ height:14px; }
  .vthumb .mini .body{ flex:1; }
  .vthumb .cap{ display:flex; align-items:center; justify-content:space-between; margin-top:5px; font-size:11px; color:#6b6558; }
  .vthumb .cap a{ color:var(--c-accent); text-decoration:none; font-weight:700; }
  .va .mini .bar{ background:var(--c-sub); } .va .mini .body{ background:linear-gradient(135deg,var(--c-main),var(--c-accent)); }
  .vb .mini .bar{ background:#202815; } .vb .mini .body{ background:linear-gradient(135deg,#3a472b,#c6a15b); }
  .vc .mini .bar{ background:#5e7439; } .vc .mini .body{ background:linear-gradient(135deg,#86a34e,#e39a3c); }

  /* toolbar */
  .toolbar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:#f7f6f1; border-bottom:1px solid #e0ddd4; padding:12px 26px; }
  .toolbar a.tb-btn, .toolbar button.tb-btn{ font-size:13px; font-weight:700; text-decoration:none;
    border-radius:20px; padding:9px 20px; border:1px solid #ddd9cf; background:#fff; color:#5b564a; cursor:pointer; }
  .toolbar a.print-btn{ background:var(--c-main); color:#fff; border-color:var(--c-main); }
  .print-a,.print-b,.print-c{ display:none; }
  /* KLK-126: 折り返せるようにする。折り返さないと、狭い画面で再生成の一式が
     ツールバーからはみ出し、**ページ全体が横スクロールになる**（375px で実測 446px）。
     横スクロールが起きるとモーダルの右端と閉じるボタンが画面外へ出てしまう。 */
  .regen-ctl{ display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap; }
  [data-warn="1"]{ color:#b4342b !important; font-weight:700; }
  /* KLK-117: 型セレクタは日本語ラベルを出すようになり、ここが意味を担う。
     薄いグレー(#8a8578=白地に 3.68:1)では読みにくいので本文色に揃える(12.00:1)。 */
  .regen-type{ font-size:11.5px; color:#2c2c2c; white-space:nowrap; }
  .regen-ctl select{ font-size:13px; padding:8px 12px; border:1px solid #ddd9cf; border-radius:8px; background:#fff; }
  .regen-ctl button[disabled]{ opacity:.5; cursor:not-allowed; }
  .regen-msg{ font-size:11px; color:#8a8578; margin:6px 26px 0; }

  /* ── KLK-126: 型は「絵」で選ぶ ─────────────────────────────────────
     ★<select id="regen-type"> は**残したまま隠す**。送信側（KLK-078/079）は
       今までどおり typeSel.value を読むので、
         ・送る値はマーカーのまま
         ・現在と違う型のときだけ desiredType を送る
         ・型を持たない番地は無効化
       という積み上げた振る舞いを**1行も書き直さずに**保てる。
       モーダルは select に値を書いて change を出すだけの「入力装置」に徹する。 */
  .regen-type[hidden]{ display:none; }

  /* 型の顔（ボタン）。押すとモーダルが開く */
  .regen-type-btn{ display:inline-flex; align-items:center; gap:9px; max-width:270px;
    padding:6px 14px 6px 8px; text-align:left; }
  .regen-type-btn .rtb-ico{ flex:0 0 34px; width:34px; }
  .regen-type-btn .rtb-txt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:12.5px; font-weight:700; color:#2c2c2c; }
  /* 一覧が開くことが見て分かるように印を出す（絵と名前だけだと「押せる」と気づきにくい） */
  .regen-type-btn .rtb-caret{ font-size:10px; color:#5b564a; flex:0 0 auto; }

  /* モーダル */
  .tm{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:18px; }
  .tm[hidden]{ display:none; }
  .tm-veil{ position:absolute; inset:0; background:rgba(30,28,24,.45); }
  .tm-box{ position:relative; background:#fff; border-radius:12px; width:100%; max-width:680px;
    max-height:86vh; display:flex; flex-direction:column; box-shadow:0 18px 50px rgba(0,0,0,.28); }
  .tm-hd{ display:flex; align-items:center; gap:10px; padding:15px 16px; border-bottom:1px solid #e6e3dc; }
  .tm-hd h2{ margin:0; font-size:15px; color:#2c2c2c; }
  .tm-addr{ font-size:12px; color:#5b564a; background:#f3f1ea; border-radius:10px; padding:3px 10px; }
  .tm-x{ margin-left:auto; border:1px solid #ddd9cf; background:#fff; border-radius:50%;
    width:32px; height:32px; font-size:15px; line-height:1; color:#5b564a; cursor:pointer; flex:0 0 32px; }
  .tm-list{ overflow:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
  /* ★1行＝アイコン＋説明を**横一列**（理恵さんの指定。2行にすると説明が改行だらけになる） */
  .tm-row{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit;
    background:#fff; border:1px solid #e6e3dc; border-radius:10px; padding:9px 13px; cursor:pointer; color:#2c2c2c; }
  .tm-row:hover{ background:#f7f6f1; border-color:var(--c-main); }
  .tm-row .tm-ico{ flex:0 0 72px; width:72px; }
  .tm-row .tm-name{ font-size:13.5px; font-weight:700; flex:1; min-width:0; }
  .tm-row .tm-mk{ font-size:11px; color:#5b564a; font-family:ui-monospace,Menlo,Consolas,monospace; white-space:nowrap; }
  .tm-row .tm-now{ font-size:11px; font-weight:700; color:#fff; background:var(--c-main);
    border-radius:10px; padding:3px 9px; white-space:nowrap; flex:0 0 auto; }
  .tm-row[aria-current="true"]{ border-color:var(--c-main); background:#f7f6f1; }
  @media (max-width:600px){
    /* スマホでも**1行を保つ**。アイコンは少し小さくするだけで畳まない */
    .tm{ padding:0; } .tm-box{ max-width:none; max-height:100vh; height:100vh; border-radius:0; }
    .tm-row{ gap:10px; padding:8px 10px; }
    .tm-row .tm-ico{ flex:0 0 56px; width:56px; }
    .tm-row .tm-name{ font-size:12.5px; }
    .tm-row .tm-mk{ display:none; }   /* 幅が足りないときはマーカーを畳む（絵と日本語を優先） */
  }

  /* 型アイコンの部品（KLK-126）。**外部依存ゼロ**（NFR-005）— div と CSS だけ。
     色は案件の配色ではなく固定の3色。配色によっては絵が背景に溶けてしまうため。 */
  .ico{--ic:#3e7f8c;--is:#cfe0e4;--il:#e6e9ea;width:100%;aspect-ratio:4/3;background:#fbfbfa;
       border:1px solid #e6e3dc;border-radius:5px;padding:5px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .ico .ir{display:flex;gap:3px;flex:1;min-height:0;min-width:0}
  .ico .ic{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .ico .ib{background:var(--is);border-radius:2px;flex:1;min-height:3px}
  .ico .it{background:var(--il);border-radius:1px;height:3px;flex:0 0 auto}
  .ico .it.s{width:55%}.ico .it.m{width:85%}.ico .it.on{background:var(--ic)}
  .ico .ihd{background:var(--ic);border-radius:2px;height:4px;width:45%;flex:0 0 auto}
  .ico .inum{background:var(--ic);opacity:.55;border-radius:2px;height:8px;width:52%;flex:0 0 auto}
  .ico .ifield{background:#fff;border:1px solid var(--is);border-radius:2px;height:7px;flex:0 0 auto}
  .ico .ibtn{background:var(--ic);border-radius:3px;height:7px;width:52%;margin:0 auto;flex:0 0 auto}
  .ico .iline{background:var(--ic);opacity:.35;border-radius:2px;flex:0 0 3px}
  .ico .iplus{background:var(--ic);border-radius:1px;width:5px;height:5px;margin-left:auto;align-self:center;flex:0 0 auto}
  .ico .itab{display:flex;gap:2px;height:5px;flex:0 0 auto}
  .ico .itab i{flex:1;background:var(--il);border-radius:1px}.ico .itab i.on{background:var(--ic)}
  .ico .iscroll{overflow:hidden;flex:1;min-height:0}.ico .iscroll .ir{width:124%}
  .ico .icenter{display:flex;flex-direction:column;gap:4px;justify-content:center;flex:1}
  .ico .ihero{background:var(--is);border-radius:2px;flex:1;display:flex;flex-direction:column;
              justify-content:center;gap:4px;padding:5px;min-height:0}
  .ico .iarrowdown{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
                   border-top:6px solid var(--ic);margin:auto auto 0}
  .ico .iband{background:var(--ic);opacity:.5;border-radius:2px;height:9px;margin-top:auto}
  .ico .ifilm{display:flex;gap:2px;margin-top:auto;height:34%}
  .ico .ifilm .ifcell{flex:1;background:#fff;opacity:.85;border-radius:0}
  .ico .iover{position:relative;flex:1;min-height:0}
  .ico .iover .iover-b{position:absolute;inset:0 32% 18% 0}
  .ico .iover .iover-p{position:absolute;right:0;bottom:6%;width:56%;background:#fff;border:1px solid var(--is);
                       border-radius:2px;padding:3px;display:flex;flex-direction:column;gap:2px}
  .ico .ichips{display:flex;flex-wrap:wrap;gap:3px;align-content:center;flex:1}
  .ico .ichip{background:var(--is);border-radius:6px;height:7px}
  .ico .inav{display:flex;gap:4px;align-items:center;background:var(--ic);opacity:.9;border-radius:2px;padding:4px;flex:0 0 auto}
  .ico .inav .ihd{background:#fff}.ico .inav .it{background:rgba(255,255,255,.65)}
  .ico .inav .ifield{background:#fff;border-color:#fff}
  .ico .igrid3{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:1;min-height:0}
  .ico .iarrow{background:var(--is);border-radius:2px;padding:3px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%)}
  .ico .isearch{display:flex;gap:3px;width:86%;margin:0 auto;flex:0 0 auto}
  .ico .isearch-i{flex:1;background:#fff;border:1px solid var(--is);border-radius:2px;height:9px}
  .ico .isearch-b{flex:0 0 22%;background:var(--ic);border-radius:2px;height:9px}

  /* canvas */
  .canvas{ padding:24px; }
  .pane{ display:none; background:#ded9cd; border-radius:8px; padding:16px; text-align:center; }
  .pane iframe{ width:100%; height:1400px; border:0; background:#fff; display:block; margin:0 auto;
    box-shadow:0 6px 24px rgba(0,0,0,.12); border-radius:4px; }

  /* 案切替（CSS-only 兄弟結合子） */
  #ra:checked ~ .canvas #paneA{ display:block; }
  #rb:checked ~ .canvas #paneB{ display:block; }
  #rc:checked ~ .canvas #paneC{ display:block; }
  #ra:checked ~ .variant-bar label[for=ra],
  #rb:checked ~ .variant-bar label[for=rb],
  #rc:checked ~ .variant-bar label[for=rc]{ background:var(--c-main); color:#fff; border-color:var(--c-main); }
  #ra:checked ~ .variant-bar .va .mini,
  #rb:checked ~ .variant-bar .vb .mini,
  #rc:checked ~ .variant-bar .vc .mini{ border-color:var(--c-main); }
  #ra:checked ~ .toolbar .print-a,
  #rb:checked ~ .toolbar .print-b,
  #rc:checked ~ .toolbar .print-c{ display:inline-block; }

  /* 幅切替（CSS-only・name=vw なので案切替と独立） */
  #vw768:checked ~ .canvas .pane iframe{ width:768px; }
  #vw375:checked ~ .canvas .pane iframe{ width:375px; }
  #vwfull:checked ~ .variant-bar label[for=vwfull],
  #vw768:checked ~ .variant-bar label[for=vw768],
  #vw375:checked ~ .variant-bar label[for=vw375]{ background:var(--c-sub); color:#fff; border-color:var(--c-sub); }

  @media print{
    .toolchrome, .variant-bar, .toolbar, .vwseg, .regen-msg{ display:none !important; }
    .canvas{ padding:0; }
    .pane iframe{ box-shadow:none; }
  }
</style>
</head>
<body>
<div class="mock-compare" data-folder="samples/02_士業_本文2カラム" data-variants="3">

  <!-- 隠しラジオ（.canvas より前に配置・兄弟結合子で切替） -->
  <input class="vswitch" type="radio" name="variant" id="ra" checked>
  <input class="vswitch" type="radio" name="variant" id="rb">
  <input class="vswitch" type="radio" name="variant" id="rc">
  <input class="vwswitch" type="radio" name="vw" id="vwfull" checked>
  <input class="vwswitch" type="radio" name="vw" id="vw768">
  <input class="vwswitch" type="radio" name="vw" id="vw375">

  <div class="toolchrome">
    <div class="proj-head">
      <span class="proj-name">サンプル法律事務所</span>
      <span class="proj-meta">生成日 2026-09-02 ／ 3案</span>
    </div>
    <div class="settings-chips">
      <span class="chip">業種 <b>士業事務所（法律/会計/コンサルティング他）</b></span>
      <span class="chip">カラム <b>2col-body-left</b></span>
      <span class="chip">テイスト <b>誠実・信頼</b></span>
      <span class="chip"><span class="sw" style="background:#2a3c6b"></span>配色 <b>#2a3c6b</b></span>
      <span class="chip">アタリ <b>standard</b></span>
    </div>
  </div>

  <div class="variant-bar">
    <div class="seg">
      <label for="ra">案A</label>
      <label for="rb">案B</label>
      <label for="rc">案C</label>
    </div>
    <div class="thumbstrip">
      <div class="vthumb va"><label for="ra"><div class="mini"><div class="bar"></div><div class="body"></div></div></label>
        <div class="cap"><span>案A</span><a href="index-a.html" target="_blank" class="full">原寸 ↗</a></div></div>
      <div class="vthumb vb"><label for="rb"><div class="mini"><div class="bar"></div><div class="body"></div></div></label>
        <div class="cap"><span>案B</span><a href="index-b.html" target="_blank" class="full">原寸 ↗</a></div></div>
      <div class="vthumb vc"><label for="rc"><div class="mini"><div class="bar"></div><div class="body"></div></div></label>
        <div class="cap"><span>案C</span><a href="index-c.html" target="_blank" class="full">原寸 ↗</a></div></div>
    </div>
    <div class="vwseg">
      <label for="vwfull">全幅</label>
      <label for="vw768">768px</label>
      <label for="vw375">375px</label>
    </div>
  </div>

  <div class="toolbar">
    <a class="tb-btn print-btn print-a" href="index-a.html" target="_blank">🖨 案Aを印刷 / PDFで保存</a>
    <a class="tb-btn print-btn print-b" href="index-b.html" target="_blank">🖨 案Bを印刷 / PDFで保存</a>
    <a class="tb-btn print-btn print-c" href="index-c.html" target="_blank">🖨 案Cを印刷 / PDFで保存</a>
    <span class="tb-btn" style="background:transparent;border:0;color:#8a8578">← 設定を変えるには設定画面で作り直してください</span>
    <div class="regen-ctl">
      <span style="font-size:13px;color:#6b6558">🔄 セクション再生成</span>
      <select id="regen-addr">
        <option value="">読み込み中…</option>
      </select>
      <select id="regen-type" class="regen-type" disabled hidden></select>
      <button class="tb-btn regen-type-btn" id="regen-type-btn" type="button"
              aria-haspopup="dialog" disabled>型を選ぶ</button>
      <button class="tb-btn" id="regen-btn" disabled>このセクションを再生成</button>
    </div>
  </div>
  <div class="regen-msg" id="regen-msg">ローカルブリッジの状態を確認しています…</div>

  <div class="canvas">
    <div class="pane" id="paneA"><iframe src="index-a.html" title="案A プレビュー"></iframe></div>
    <div class="pane" id="paneB"><iframe src="index-b.html" title="案B プレビュー"></iframe></div>
    <div class="pane" id="paneC"><iframe src="index-c.html" title="案C プレビュー"></iframe></div>
  </div>

</div>

<!-- KLK-126: 型を絵で選ぶモーダル。画面全体に一覧を出す（理恵さんの指定） -->
<div class="tm" id="type-modal" role="dialog" aria-modal="true" aria-labelledby="type-modal-title" hidden>
  <div class="tm-veil"></div>
  <div class="tm-box">
    <div class="tm-hd">
      <h2 id="type-modal-title">レイアウト型を選ぶ</h2>
      <span class="tm-addr" id="type-modal-addr"></span>
      <button class="tm-x" id="type-modal-x" type="button" aria-label="閉じる">✕</button>
    </div>
    <div class="tm-list" id="type-modal-list"></div>
  </div>
</div>

<script>
  (function () {
    var root = document.querySelector('.mock-compare');
    var folder = root.getAttribute('data-folder');
    var btn = document.getElementById('regen-btn');
    var sel = document.getElementById('regen-addr');
    var typeSel = document.getElementById('regen-type');
    var msg = document.getElementById('regen-msg');
    var BASE = 'http://127.0.0.1:8765';
    var sections = [];

    function setMsg(t){ msg.textContent = t; }

    function currentLetter(){
      var c = document.querySelector('input[name=variant]:checked');
      return c ? c.id.replace('r','') : 'a';
    }

    function hit(){
      for (var i = 0; i < sections.length; i++) {
        if (sections[i].addr === sel.value) { return sections[i]; }
      }
      return null;
    }

    function clear(el){ while (el.firstChild) { el.removeChild(el.firstChild); } }

    function opt(value, label){
      var o = document.createElement('option');
      o.value = value;
      o.textContent = label;   // 動的値は textContent（注入対策）
      return o;
    }


    // ══ KLK-126: 型を「絵」で選ぶ ══════════════════════════════════════
    // 型アイコンのレシピ（KLK-126）。**1行＝1つの絵**。
    //   ★規約 §12.1.2/§12.1.3 の説明文を読んで**明示的に**決めた表である。

    // アイコンを描く（外部依存ゼロ・入れ子 div と CSS のみ。SCR-001 のカラム図と同じ流儀）
    function icoEl(tag, cls, css){
      var e = document.createElement(tag || 'div');
      if (cls) e.className = cls;
      if (css) { for (var k in css) e.style[k] = css[k]; }
      return e;
    }
    function icoBox(o){
      var b = icoEl('div', 'ib');
      if (o && o.circle) { b.style.borderRadius = '50%'; b.style.aspectRatio = '1'; b.style.alignSelf = 'center'; b.style.width = '76%'; b.style.flex = '0 0 auto'; }
      if (o && o.square) b.style.aspectRatio = '1';
      return b;
    }
    function icoCell(cell, o){
      o = o || {};
      var c;
      if (cell === 'img')     { c = icoEl('div','ic'); c.appendChild(icoBox(o)); return c; }
      if (cell === 'img+2')   { c = icoEl('div','ic'); c.appendChild(icoBox(o)); c.appendChild(icoEl('div','it m')); c.appendChild(icoEl('div','it s')); return c; }
      if (cell === 'num')     { c = icoEl('div','ic'); c.appendChild(icoEl('div','inum')); c.appendChild(icoEl('div','it s')); return c; }
      if (cell === 'arrow')   { c = icoEl('div','ic iarrow'); c.appendChild(icoEl('div','inum')); return c; }
      if (cell === 'field')   { c = icoEl('div','ic'); c.appendChild(icoEl('div','it s')); c.appendChild(icoEl('div','ifield')); return c; }
      if (cell === 'line')    { c = icoEl('div','ir'); c.appendChild(icoEl('div','it s', {width:'22%',alignSelf:'center'})); c.appendChild(icoEl('div','it m', {alignSelf:'center'})); c.style.flex='0 0 auto'; return c; }
      if (cell === 'lineprice'){ c = icoEl('div','ir'); c.appendChild(icoEl('div','it m', {alignSelf:'center'})); c.appendChild(icoEl('div','it s', {width:'18%',alignSelf:'center',marginLeft:'auto'})); c.style.flex='0 0 auto'; return c; }
      if (cell === 'qa')      { c = icoEl('div','ic'); c.appendChild(icoEl('div','ihd', {width:'30%'})); c.appendChild(icoEl('div','it m')); return c; }
      if (cell === 'quote')   { c = icoEl('div','ir'); c.appendChild(icoEl('div','iline')); var x=icoEl('div','ic'); x.appendChild(icoEl('div','it m')); x.appendChild(icoEl('div','it s')); c.appendChild(x); return c; }
      if (cell === 'timeline'){ c = icoEl('div','ir'); c.appendChild(icoEl('div','iline')); var y=icoEl('div','ic'); y.appendChild(icoEl('div','ihd')); y.appendChild(icoEl('div','it m')); c.appendChild(y); return c; }
      if (cell === 'imgleft') { c = icoEl('div','ir'); var b=icoBox(o); b.style.flex='0 0 ' + (o.thumb==='sm'?'22%':'32%'); c.appendChild(b);
                                var tx=icoEl('div','ic'); tx.appendChild(icoEl('div','ihd')); tx.appendChild(icoEl('div','it m')); tx.appendChild(icoEl('div','it s')); c.appendChild(tx); return c; }
      if (cell === 'numleft') { c = icoEl('div','ir'); c.appendChild(icoEl('div','inum', {flex:'0 0 22%'}));
                                var tz=icoEl('div','ic'); tz.appendChild(icoEl('div','ihd')); tz.appendChild(icoEl('div','it m')); c.appendChild(tz); return c; }
      if (cell === 'text')    { c = icoEl('div','ic'); c.appendChild(icoEl('div','ihd')); c.appendChild(icoEl('div','it m')); c.appendChild(icoEl('div','it s')); c.appendChild(icoEl('div','it s')); return c; }
      if (cell === 'nav')     { c = icoEl('div','ic'); for (var i=0;i<4;i++) c.appendChild(icoEl('div','it m')); return c; }
      if (cell === 'list')    { c = icoEl('div','ic'); for (var j=0;j<3;j++) c.appendChild(icoEl('div','it m')); return c; }
      if (cell === 'grid3')   { c = icoEl('div','igrid3'); for (var g=0;g<4;g++) c.appendChild(icoBox(o)); return c; }
      if (cell === 'table')   { return icoTable({rows:3, cols:3}); }
      c = icoEl('div','ic'); c.appendChild(icoBox(o)); return c;
    }
    function icoTable(r){
      var w = icoEl('div','ic');
      for (var y=0;y<(r.rows||4);y++){
        var row = icoEl('div','ir', {flex:'0 0 auto'});
        for (var x=0;x<(r.cols||3);x++){
          var t = icoEl('div','it', {flex:'1', height:'4px'});
          if (y===0) t.classList.add('on');
          else if (r.marks && x>0) { t.style.width='4px'; t.style.flex='0 0 4px'; t.style.borderRadius='50%'; t.style.margin='0 auto'; }
          row.appendChild(t);
        }
        w.appendChild(row);
      }
      return w;
    }
    // レシピ1つ → アイコンの DOM
    function renderIcon(marker){
      var r = ICONS[marker];
      var ico = icoEl('div','ico');
      if (!r) { ico.appendChild(icoEl('div','it m')); return ico; }   // 未知の型でも空にしない
      var i, y, x, row;
      if (r.k === 'grid'){
        for (y=0;y<(r.rows||1);y++){ row = icoEl('div','ir');
          for (x=0;x<r.cols;x++){ var cE = icoCell(r.cell, r); if (r.alt && (y+x)%2===1) cE.style.flexDirection='column-reverse'; row.appendChild(cE); }
          ico.appendChild(row); }
      } else if (r.k === 'rows'){
        for (i=0;i<r.rows;i++){ var c2 = icoCell(r.cell, r); if (r.alt && i%2===1) c2.style.flexDirection='row-reverse'; ico.appendChild(c2); }
        for (i=0;i<(r.textAfter||0);i++) ico.appendChild(icoEl('div','it ' + (i?'s':'m')));
        if (r.foot) ico.appendChild(icoEl('div','ibtn'));
      } else if (r.k === 'row'){
        row = icoEl('div','ir');
        for (x=0;x<r.cols;x++) row.appendChild(icoCell(r.cell, r));
        ico.appendChild(row);
        if (r.foot) ico.appendChild(icoEl('div','ibtn'));
      } else if (r.k === 'split'){
        row = icoEl('div','ir');
        var L = r.left==='img' ? icoCell('img', r) : icoCell(r.left, r);
        var R = r.right==='img' ? icoCell('img', r) : icoCell(r.right, r);
        L.style.flex = r.ratio[0]; R.style.flex = r.ratio[1];
        row.appendChild(L); row.appendChild(R); ico.appendChild(row);
      } else if (r.k === 'table'){ ico.appendChild(icoTable(r));
      } else if (r.k === 'tabs'){
        var tb = icoEl('div','itab'); for (i=0;i<3;i++){ var tt=icoEl('i'); if(i===0) tt.className='on'; tb.appendChild(tt);} ico.appendChild(tb);
        for (y=0;y<(r.rows||1);y++){ row = icoEl('div','ir');
          for (x=0;x<(r.cols||2);x++) row.appendChild(icoCell(r.cell || 'img', r));
          ico.appendChild(row); }
      } else if (r.k === 'accordion'){
        if (r.head) ico.appendChild(icoEl('div','ifield'));
        for (i=0;i<r.rows;i++){ row = icoEl('div','ir', {flex:'0 0 auto'});
          row.appendChild(icoEl('div','it m', {alignSelf:'center'}));
          row.appendChild(icoEl('div','iplus'));
          ico.appendChild(row); }
      } else if (r.k === 'scroll'){
        var wrap = icoEl('div','iscroll'); row = icoEl('div','ir');
        for (x=0;x<4;x++){ var sc = icoCell(r.cell, r); if (r.tall) sc.style.flex='0 0 26%'; row.appendChild(sc); }
        wrap.appendChild(row); ico.appendChild(wrap);
      } else if (r.k === 'mosaic'){
        row = icoEl('div','ir'); var big = icoBox(r); big.style.flex='2';
        var col = icoEl('div','ic'); col.appendChild(icoBox(r)); col.appendChild(icoBox(r));
        row.appendChild(big); row.appendChild(col); ico.appendChild(row);
        var row2 = icoEl('div','ir', {flex:'0 0 30%'});
        for (i=0;i<3;i++) row2.appendChild(icoBox(r)); ico.appendChild(row2);
      } else if (r.k === 'feature'){
        ico.appendChild(icoBox(r));
        row = icoEl('div','ir', {flex:'0 0 32%'});
        for (x=0;x<r.cols;x++) row.appendChild(icoBox(r)); ico.appendChild(row);
      } else if (r.k === 'featured3'){
        row = icoEl('div','ir');
        for (x=0;x<3;x++){ var f = icoCell('img+2', r); f.style.flex = (x===1?'1.4':'1'); if(x===1) f.style.alignSelf='stretch'; row.appendChild(f); }
        ico.appendChild(row);
      } else if (r.k === 'center'){
        var cw = icoEl('div','icenter');
        (r.parts||[]).forEach(function(p){
          if (p==='hd') cw.appendChild(icoEl('div','ihd', {width:'55%',margin:'0 auto'}));
          else if (p==='t') cw.appendChild(icoEl('div','it m', {width:'70%',margin:'0 auto'}));
          else if (p==='btn') cw.appendChild(icoEl('div','ibtn'));
          else if (p==='searchbar') cw.appendChild(icoEl('div','ifield', {width:'80%',margin:'0 auto'}));
          else if (p==='searchbig') { var sb=icoEl('div','isearch'); sb.appendChild(icoEl('div','isearch-i')); sb.appendChild(icoEl('div','isearch-b')); cw.appendChild(sb); }
        });
        ico.appendChild(cw);
      } else if (r.k === 'hero'){
        var h = icoEl('div','ihero');
        (r.parts||[]).forEach(function(p){
          if (p==='hd') h.appendChild(icoEl('div','ihd', {width:'55%',margin:'0 auto'}));
          else if (p==='arrow') h.appendChild(icoEl('div','iarrowdown'));
          else if (p==='searchbar') h.appendChild(icoEl('div','ifield', {width:'76%',margin:'0 auto'}));
          else if (p==='centerbig') h.appendChild(icoEl('div','ihd', {width:'62%',height:'7px',margin:'auto'}));
          else if (p==='center') h.appendChild(icoEl('div','ihd', {width:'50%',margin:'auto'}));
          else if (p==='band') h.appendChild(icoEl('div','iband'));
          else if (p==='btn') h.appendChild(icoEl('div','ibtn', {width:'44%',margin:'0 auto'}));
          else if (p==='split') { h.style.alignItems='center'; h.appendChild(icoEl('div','ihd', {width:'42%',marginRight:'auto'})); }
          else if (p==='film') { var fl=icoEl('div','ifilm'); for(i=0;i<4;i++) fl.appendChild(icoEl('div','ifcell')); h.appendChild(fl); }
        });
        ico.appendChild(h);
      } else if (r.k === 'overlap'){
        var ov = icoEl('div','iover');
        var ob = icoBox(r); ob.className = 'ib iover-b'; ov.appendChild(ob);
        var op = icoEl('div','iover-p'); op.appendChild(icoEl('div','ihd')); op.appendChild(icoEl('div','it m'));
        ov.appendChild(op); ico.appendChild(ov);
      } else if (r.k === 'chips'){
        var cw2 = icoEl('div','ichips');
        [38,26,30,22,34,28].forEach(function(w){ cw2.appendChild(icoEl('div','ichip', {width:w+'%'})); });
        ico.appendChild(cw2);
      } else if (r.k === 'navbar'){
        var nb = icoEl('div','inav');
        nb.appendChild(icoEl('div','ihd', {width:'22%',margin:'0'}));
        nb.appendChild(icoEl('div','it s', {width:'26%'}));
        nb.appendChild(icoEl('div','ifield', {width:'34%',marginLeft:'auto'}));
        ico.appendChild(nb);
        ico.appendChild(icoEl('div','it m'));
        ico.appendChild(icoEl('div','it s'));
      }
      return ico;
    }

    // --- モーダル・ピッカー ------------------------------------------------
    var typeBtn   = document.getElementById('regen-type-btn');
    var modal     = document.getElementById('type-modal');
    var modalList = document.getElementById('type-modal-list');
    var modalAddr = document.getElementById('type-modal-addr');
    var lastFocus = null;

    // ボタンの「顔」＝いま選ばれている型の絵と名前
    function paintFace(){
      clear(typeBtn);
      var s = hit();
      var mk = (!typeSel.disabled && typeSel.value) ? typeSel.value : '';
      if (!mk) {
        typeBtn.disabled = true;
        var none = icoEl('span', 'rtb-txt');
        // 型を持たない番地（NAV など）では select と同じことを言う（KLK-081）
        none.textContent = (typeSel.firstChild && typeSel.firstChild.textContent) || '—';
        typeBtn.appendChild(none);
        return;
      }
      typeBtn.disabled = false;
      var ic = renderIcon(mk); ic.className = 'ico rtb-ico';
      typeBtn.appendChild(ic);
      var tx = icoEl('span', 'rtb-txt');
      tx.textContent = ((s && s.labels && s.labels[mk]) || mk);
      typeBtn.appendChild(tx);
      var ca = icoEl('span', 'rtb-caret');
      ca.textContent = '▾';
      typeBtn.appendChild(ca);
    }

    // 一覧を組み立てる（1行＝アイコン＋日本語ラベル＋マーカー）
    function buildTypeList(){
      var s = hit();
      clear(modalList);
      modalAddr.textContent = (s && s.addr) || '';
      if (!s || !s.pool || !s.pool.length) { return; }
      var labels = s.labels || {};
      s.pool.forEach(function (t) {
        var row = icoEl('button', 'tm-row');
        row.type = 'button';
        row.setAttribute('data-type', t);
        var ic = renderIcon(t); ic.className = 'ico tm-ico';
        row.appendChild(ic);
        var nm = icoEl('span', 'tm-name'); nm.textContent = labels[t] || t; row.appendChild(nm);
        var mk = icoEl('span', 'tm-mk');  mk.textContent = t;              row.appendChild(mk);
        if (t === s.current) {
          row.setAttribute('aria-current', 'true');
          var nw = icoEl('span', 'tm-now'); nw.textContent = '現在'; row.appendChild(nw);
        }
        row.addEventListener('click', function () { pickType(t); });
        modalList.appendChild(row);
      });
    }

    // ★選んだ結果は select に書き戻すだけ。送信側は select しか見ていない。
    function pickType(t){
      typeSel.value = t;
      if (typeof Event === 'function' && typeSel.dispatchEvent) {
        typeSel.dispatchEvent(new Event('change'));
      }
      paintFace();
      closeTypeModal();
    }

    function openTypeModal(){
      var s = hit();
      if (!s || !s.pool || !s.pool.length) { return; }
      buildTypeList();
      lastFocus = typeBtn;
      modal.hidden = false;
      var rows = modalList.children;
      var start = null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].getAttribute('aria-current') === 'true') { start = rows[i]; }
      }
      start = start || rows[0];
      if (start && start.focus) { start.focus(); }
    }

    function closeTypeModal(){
      modal.hidden = true;
      if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
    }

    typeBtn.addEventListener('click', openTypeModal);
    document.getElementById('type-modal-x').addEventListener('click', closeTypeModal);
    modal.addEventListener('click', function (e) {
      // 覆い（またはモーダルの外側）を押したら閉じる
      if (e.target === modal || (e.target && e.target.className === 'tm-veil')) { closeTypeModal(); }
    });
    document.addEventListener('keydown', function (e) {
      if (modal.hidden) { return; }
      var k = e.key;
      if (k === 'Escape' || k === 'Esc') { closeTypeModal(); return; }
      if (k !== 'Tab') { return; }
      // 簡易フォーカストラップ（モーダルの外へ Tab で出て行かせない）
      var f = [document.getElementById('type-modal-x')];
      var rows = modalList.children;
      for (var i = 0; i < rows.length; i++) { f.push(rows[i]); }
      var at = f.indexOf(document.activeElement);
      var to = e.shiftKey ? (at <= 0 ? f.length - 1 : at - 1) : (at === f.length - 1 ? 0 : at + 1);
      if (f[to] && f[to].focus) { e.preventDefault(); f[to].focus(); }
    });

    // 型セレクタを、選んだ番地のプールで組み立てる（現在の型に「（現在）」）
    function fillTypes(){
      var s = hit();
      clear(typeSel);
      if (!s || !s.pool || s.pool.length === 0) {
        typeSel.appendChild(opt('', 'この番地に型はありません'));
        typeSel.disabled = true;
        paintFace();
        return;
      }
      // KLK-117: 英語のマーカーだけでは型が掴めないので、日本語ラベルを先に出す。
      //   ラベルは /sections の labels（規約 §12.1.x の説明文からの抜き書き）。
      //   値（送る desiredType）はマーカーのまま。labels が無い旧ブリッジではマーカーだけ出す。
      var labels = s.labels || {};
      s.pool.forEach(function(t){
        var name = labels[t] ? labels[t] + '（' + t + '）' : t;
        typeSel.appendChild(opt(t, t === s.current ? name + '（現在）' : name));
      });
      typeSel.value = s.current || s.pool[0];
      typeSel.disabled = false;
      paintFace();
    }

    // ★セレクタを「読み込み中…」のままにしない（KLK-081）
    //   KLK-078 で番地を /sections から埋める方式にしたとき、
    //   取得に失敗した場合の表示を作り忘れ、見本では固まったままになっていた。
    function disableWith(label, message){
      clear(sel);
      sel.appendChild(opt('', label));
      clear(typeSel);
      typeSel.appendChild(opt('', '—'));
      typeSel.disabled = true;
      paintFace();
      btn.disabled = true;
      setMsg(message);
    }

    // ★番地は焼き込まず、実ページから読む（KLK-078）
    //   焼き込むとセクション構成の変わるページと食い違い、
    //   「選べるのに 404」「実在するのに選べない」が起きる。
    function loadSections(){
      // ブリッジは書き込み面を絞るため mockups/ 配下しか受け付けない。
      // 見本（samples/）は対象外なので、呼ぶ前にそう伝える（KLK-081）。
      if (folder.indexOf('mockups/') !== 0) {
        disableWith('（見本では使えません）',
          'これは見本です。セクション再生成はご自身の生成物（mockups/ の中）でお使いください。');
        return Promise.resolve();
      }
      var url = BASE + '/sections?folder=' + encodeURIComponent(folder)
              + '&letter=' + encodeURIComponent(currentLetter());
      return fetch(url)
        .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
        .then(function(j){
          sections = j.sections || [];
          if (!sections.length) {
            disableWith('（セクションなし）', 'このページに再生成できるセクションが見つかりませんでした。');
            return;
          }
          clear(sel);
          sections.forEach(function(s){ sel.appendChild(opt(s.addr, s.addr)); });
          fillTypes();
          btn.disabled = false;
          setMsg('ローカルブリッジ稼働中。番地と型を選んで再生成できます。');
        })
        .catch(function(){
          disableWith('（取得できませんでした）',
            'セクション一覧を取得できませんでした。ローカルブリッジをご確認ください。');
        });
    }

    // health-gate（約800ms）
    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, 800);
    fetch(BASE + '/health', { signal: ctrl.signal })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(){ clearTimeout(to); loadSections(); })
      .catch(function(){
        clearTimeout(to);
        disableWith('（ブリッジ未起動）',
          'ローカルブリッジ未起動。python3 draft-gen/bridge.py を起動するか、Claude Code で /draft-regenerate ' + folder + ' {案の letter} {番地} {型} でも再生成できます。');
      });

    sel.addEventListener('change', fillTypes);
    // 案を切り替えると型も変わる（案ごとに別の型が割り当たる）ので読み直す
    Array.prototype.forEach.call(
      document.querySelectorAll('input[name=variant]'),
      function(r){ r.addEventListener('change', loadSections); }
    );

    btn.addEventListener('click', function(){
      var letter = currentLetter();
      var addr = sel.value;
      if (!addr) { setMsg('番地を選んでください。'); return; }
      var s = hit();
      // 現在と違う型を選んだときだけ型指定を載せる（同じなら文言だけの作り直し）
      var wanted = (!typeSel.disabled && typeSel.value && s && typeSel.value !== s.current)
                 ? typeSel.value : null;
      var body = { folder: folder, letter: letter, addr: addr };
      if (wanted) { body.desiredType = wanted; }
      btn.disabled = true;
      setMsg('案' + letter.toUpperCase() + ' の ' + addr
             + (wanted ? ' を ' + wanted + ' に作り直しています…' : ' を再生成しています…'));
      fetch(BASE + '/regenerate', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      })
      .then(function(r){ return r.json(); })
      .then(function(j){
        var jobId = j.jobId;
        if(!jobId){ throw new Error(j.error || ''); }
        var poll = setInterval(function(){
          fetch(BASE + '/status/' + jobId)
            .then(function(r){ return r.json(); })
            .then(function(s2){
              if(s2.state === 'done'){
                clearInterval(poll);
                var warns = s2.warnings || [];
                // ★型が反映されなかった / 規約違反の疑いがある ときは
                //   成功と同じ見た目にしない（KLK-079 / KLK-080）
                if (s2.typeApplied === false || warns.length) {
                  btn.disabled = false;
                  msg.textContent = '⚠ ' + s2.message
                    + (warns.length ? ' — ' + warns.join(' / ') : '');
                  msg.setAttribute('data-warn', '1');
                  return;
                }
                msg.removeAttribute('data-warn');
                setMsg('再生成が完了しました。プレビューを再読み込みします。');
                location.reload();
              }
              else if(s2.state === 'error'){ clearInterval(poll); btn.disabled = false; setMsg('再生成に失敗しました。設定を変えてお試しください。'); }
            })
            .catch(function(){ clearInterval(poll); btn.disabled = false; setMsg('状態の取得に失敗しました。'); });
        }, 900);
      })
      .catch(function(){ btn.disabled = false; setMsg('再生成の開始に失敗しました。ローカルブリッジをご確認ください。'); });
    });
  })();
</script>
</body>
</html>
