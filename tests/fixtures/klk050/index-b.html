<!DOCTYPE html>
<!--
  KLK-050 ゴールデン（SNS 6型化・案B / letter=b）— 1col×below-hero→offset3→(3,4,5)
  SNS=sns-reels(index4・縦長9:16リール帯)。HERO=center-scroll(index4)。SNS は実埋め込み禁止・外部URL0・アタリ色面。
  案件名: サンプルカフェ / 業種: 飲食店・カフェ・食関連 / 1col / below-hero / archetype=split-editorial
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプルカフェ | デザインラフ 案B</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; line-height: 1.8; }
  .mock { --m-main: #24303a; --m-nav: #161d24; --m-accent: #cc8a4a; --m-bg: #f1f0ec; --m-text: #2b2b2b; background: var(--m-bg); color: var(--m-text); overflow: hidden; position: relative; }
  .sec { position: relative; }
  .addr { position: absolute; top: 8px; left: 8px; z-index: 5; display: inline-flex; gap: 6px; align-items: center; }
  .addr .pin { background: rgba(17,24,39,.82); color: #fff; font-size: 10px; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; font-family: ui-monospace, monospace; }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

  .m-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: var(--m-nav); color: #fff; }
  .m-nav .logo { font-size: 17px; font-weight: 700; letter-spacing: .1em; }
  .m-nav ul { display: flex; gap: 16px; list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .m-nav .cta { background: var(--m-accent); color: #1a1a1a; padding: 6px 14px; border-radius: 2px; font-size: 12px; font-weight: 700; }

  /* HERO 型: center-scroll（全面ビジュアル背景＋キャッチ上・スクロール誘導↓下の上下分散・index4） */
  .m-hero { position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; min-height: 420px; padding: 48px 20px; color: #fff;
    background: linear-gradient(rgba(15,18,24,.5), rgba(15,18,24,.42)), repeating-linear-gradient(45deg, var(--m-main), var(--m-main) 14px, color-mix(in srgb, var(--m-main) 86%, #000) 14px, color-mix(in srgb, var(--m-main) 86%, #000) 28px); }
  .m-hero .hero-main { display: flex; flex-direction: column; align-items: center; }
  .m-hero .catch { font-size: 32px; font-weight: 700; letter-spacing: .06em; margin: 0 0 14px; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .m-hero .lead { font-size: 15px; max-width: 520px; margin: 0 0 22px; }
  .m-hero .hero-cta { background: var(--m-accent); color: #1a1a1a; padding: 12px 30px; border-radius: 2px; font-size: 14px; font-weight: 700; }
  .m-hero .scroll-cue { font-size: 12px; letter-spacing: .2em; line-height: 1.5; opacity: .85; font-family: ui-monospace, monospace; }
  .atari-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-family: "Hiragino Sans", sans-serif; }

  .m-sec { padding: 40px 28px; max-width: 940px; margin: 0 auto; }
  .m-sec h2 { text-align: left; font-size: 23px; letter-spacing: .06em; margin: 0 0 4px; color: var(--m-main); border-left: 3px solid var(--m-accent); padding-left: 12px; }
  .m-sec .en { text-align: left; font-size: 11px; letter-spacing: .3em; color: var(--m-accent); margin: 0 0 22px 15px; font-family: ui-monospace, monospace; }

  .atari { background: linear-gradient(135deg, color-mix(in srgb, var(--m-main) 22%, #fff), color-mix(in srgb, var(--m-accent) 26%, #fff)); border: 1px dashed color-mix(in srgb, var(--m-main) 45%, #999); border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: color-mix(in srgb, var(--m-main) 55%, #333); padding: 10px; gap: 4px; font-family: "Hiragino Sans", sans-serif; }
  .atari .ic { font-size: 18px; }
  .atari .desc { font-size: 11px; font-weight: 600; }

  /* SNS 型: sns-reels（縦長9:16リール/ストーリーズ帯・横スクロール・§12.1.3 index4・KLK-050新） */
  .m-sns.sns-reels { display: flex; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; gap: 12px; scroll-snap-type: x mandatory; padding-bottom: 8px; }
  .m-sns.sns-reels .sns-reel { flex: 0 0 150px; scroll-snap-align: start; }
  .m-sns.sns-reels .sns-reel .atari { aspect-ratio: 9 / 16; min-height: 0; border-radius: 8px; }

  /* 詳細誘導ボタン共通規約（§4.3・KLK-048） */
  .sec-more { text-align: center; margin-top: 40px; }
  .sec-more .sec-more-btn { display: inline-block; border: 1.5px solid var(--m-main); color: var(--m-main); background: #fff; padding: 11px 30px; border-radius: 24px; font-size: 13px; font-weight: 700; }

  .m-foot { background: var(--m-nav); color: #fff; text-align: center; padding: 30px 20px; }
  .m-foot .fnav { font-size: 11px; opacity: .85; }

  @media (max-width: 640px) {
    .m-nav ul { display: none; }
    .m-nav::after { content: "\2630"; color: #fff; font-size: 20px; }
    .m-hero { padding: 32px 16px; }
    .m-hero .catch { font-size: 25px; }
    .m-sns.sns-reels .sns-reel { flex: 0 0 40vw; }
    .m-sec { padding: 28px 16px; }
  }
  @media print {
    .addr, .atari-tag, .anim-note { display: none !important; }
    body { background: #fff; }
    .mock { box-shadow: none; border-radius: 0; }
    .reveal { opacity: 1 !important; transform: none !important; }
    .m-sns.sns-reels { flex-wrap: wrap; overflow-x: visible; }
  }
</style>
</head>
<body>

<div class="mock" data-columns="1col" data-archetype="split-editorial" data-section-order="SNS" data-nav-position="below-hero">

  <div class="sec reveal">
    <div class="addr"><span class="pin">MV-01</span></div>
    <div class="m-hero" data-hero="center-scroll">
      <div class="hero-main">
        <h1 class="catch">今日のひと息に。</h1>
        <p class="lead">自家焙煎の一杯と季節の焼き菓子。ゆっくり流れる時間をどうぞ。</p>
        <span class="hero-cta">メニューを見る ＞</span>
      </div>
      <div class="scroll-cue">↓<br>Scroll</div>
      <span class="atari-tag">📷 アタリ: 全幅ビジュアル / 検索: cafe coffee interior</span>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">NAV-01</span></div>
    <div class="m-nav">
      <span class="logo">SAMPLE CAFE</span>
      <ul><li>MENU</li><li>SNS</li><li>CONTACT</li></ul>
      <span class="cta">ご予約</span>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">SNS-01</span></div>
    <div class="m-sec">
      <h2>SNS</h2><div class="en">Reels</div>
      <div class="m-sns sns-reels">
        <div class="sns-reel"><div class="atari"><span class="ic">🎬</span><span class="desc">ラテアート</span></div></div>
        <div class="sns-reel"><div class="atari"><span class="ic">🎬</span><span class="desc">仕込み風景</span></div></div>
        <div class="sns-reel"><div class="atari"><span class="ic">🎬</span><span class="desc">新作スイーツ</span></div></div>
        <div class="sns-reel"><div class="atari"><span class="ic">🎬</span><span class="desc">店内ツアー</span></div></div>
        <div class="sns-reel"><div class="atari"><span class="ic">🎬</span><span class="desc">焙煎の様子</span></div></div>
      </div>
      <div class="sec-more"><a class="sec-more-btn" href="#">リールをもっと見る ＞</a></div>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">FOOTER-01</span></div>
    <div class="m-foot">
      <div class="fnav">MENU ・ SNS ・ CONTACT<br>© SAMPLE CAFE</div>
    </div>
  </div>

</div>

<script>
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (ens) { ens.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }); }, { threshold: .12 });
    els.forEach(function (e) { io.observe(e); });
  })();
</script>

</body>
</html>
