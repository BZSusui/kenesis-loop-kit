<!DOCTYPE html>
<!--
  KLK-050 ゴールデン（SNS 6型化・案A / letter=a）— 1col×below-hero→offset3→(3,4,5)
  offset3→SNS 各 index(3,4,5)：案A=sns-masonry・案B=sns-reels・案C=sns-feed（新3型）。HERO=overlap(index3)。
  これはテスト検証用のプレースホルダ出力です。実在の顧客・案件ではありません（サンプル）。
  案件名: サンプルカフェ / 業種: 飲食店・カフェ・食関連 / カラム: 1col / nav: below-hero / archetype=stack-centered / SNS=sns-masonry(index3)
  SNS は実埋め込み禁止・外部URL0・アタリ色面（NFR-005）。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプルカフェ | デザインラフ 案A</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; line-height: 1.7; }
  .mock { --m-main: #6b4f3a; --m-nav: #3a2c20; --m-accent: #cc8a4a; --m-bg: #f8f4ee; --m-text: #3a322a; background: var(--m-bg); color: var(--m-text); overflow: hidden; position: relative; }
  .sec { position: relative; }
  .addr { position: absolute; top: 8px; left: 8px; z-index: 5; display: inline-flex; gap: 6px; align-items: center; }
  .addr .pin { background: rgba(17,24,39,.82); color: #fff; font-size: 10px; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; font-family: ui-monospace, monospace; }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

  .m-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: var(--m-nav); color: #fff; }
  .m-nav .logo { font-size: 17px; font-weight: 700; letter-spacing: .06em; }
  .m-nav ul { display: flex; gap: 16px; list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .m-nav .cta { background: var(--m-accent); color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 12px; }

  /* HERO 型: overlap（右せり出し横長画像＋左白背景文言の重なり・index3） */
  .m-hero { position: relative; display: grid; grid-template-columns: 1fr 2fr; align-items: center; justify-content: flex-start; text-align: left; min-height: 360px; padding: 0; color: var(--m-text); background: none; }
  .m-hero .hero-img { grid-column: 2 / 3; grid-row: 1; align-self: stretch; min-height: 300px; border-radius: 0; }
  .m-hero .hero-text { grid-column: 1 / 2; grid-row: 1; z-index: 1; justify-self: start; align-self: center; background: rgba(255,255,255,.93); padding: 32px 36px; margin-left: 24px; max-width: 460px; box-shadow: 0 8px 30px rgba(0,0,0,.12); transform: translateX(28%); }
  .m-hero .catch { font-size: 30px; font-weight: 700; letter-spacing: .06em; margin: 0 0 12px; color: var(--m-main); }
  .m-hero .lead { font-size: 15px; margin: 0 0 20px; }
  .m-hero .hero-cta { background: var(--m-accent); color: #fff; padding: 12px 30px; border-radius: 4px; font-size: 14px; }
  .atari-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; }

  .m-sec { padding: 40px 24px; max-width: 940px; margin: 0 auto; }
  .m-sec h2 { text-align: center; font-size: 22px; letter-spacing: .1em; margin: 0 0 4px; color: var(--m-main); }
  .m-sec .en { text-align: center; font-size: 11px; letter-spacing: .3em; color: var(--m-accent); margin-bottom: 22px; font-family: ui-monospace, monospace; }

  .atari { background: linear-gradient(135deg, color-mix(in srgb, var(--m-main) 22%, #fff), color-mix(in srgb, var(--m-accent) 26%, #fff)); border: 1px dashed color-mix(in srgb, var(--m-main) 45%, #999); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: color-mix(in srgb, var(--m-main) 55%, #333); padding: 10px; gap: 4px; }
  .atari .ic { font-size: 18px; }
  .atari .desc { font-size: 11px; font-weight: 600; }

  /* SNS 型: sns-masonry（大小混在ベントー・§12.1.3 index3・KLK-050新。各タイルは 3:4／4:3 に近い比率＝行高≒列幅×0.7・平たいタイルは作らない） */
  .m-sns.sns-masonry { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 150px; grid-auto-flow: row dense; gap: 8px; }
  .m-sns.sns-masonry .atari { min-height: 0; }
  .m-sns.sns-masonry .atari:nth-child(1) { grid-column: span 2; grid-row: span 2; } /* 大（≒4:3） */
  .m-sns.sns-masonry .atari:nth-child(2) { grid-column: span 1; grid-row: span 1; } /* ≒4:3 */
  .m-sns.sns-masonry .atari:nth-child(3) { grid-column: span 1; grid-row: span 1; } /* ≒4:3 */
  .m-sns.sns-masonry .atari:nth-child(4) { grid-column: span 1; grid-row: span 2; } /* 縦長（≒3:4） */
  .m-sns.sns-masonry .atari:nth-child(5) { grid-column: span 1; grid-row: span 2; } /* 縦長（≒3:4） */
  .m-sns.sns-masonry .atari:nth-child(6) { grid-column: span 1; grid-row: span 1; } /* ≒4:3 */
  .m-sns.sns-masonry .atari:nth-child(7) { grid-column: span 1; grid-row: span 1; } /* ≒4:3 */

  /* 詳細誘導ボタン共通規約（§4.3・KLK-048） */
  .sec-more { text-align: center; margin-top: 40px; }
  .sec-more .sec-more-btn { display: inline-block; border: 1.5px solid var(--m-main); color: var(--m-main); background: #fff; padding: 11px 30px; border-radius: 24px; font-size: 13px; font-weight: 700; }

  .m-foot { background: var(--m-nav); color: #fff; text-align: center; padding: 30px 20px; }
  .m-foot .fnav { font-size: 11px; opacity: .85; }

  @media (max-width: 640px) {
    .m-nav ul { display: none; }
    .m-nav::after { content: "\2630"; color: #fff; font-size: 20px; }
    .m-hero { grid-template-columns: 1fr; }
    .m-hero .hero-text { transform: none; margin: -40px 16px 0; }
    .m-hero .hero-img { grid-column: 1; }
    .m-hero .catch { font-size: 24px; }
    .m-sns.sns-masonry { grid-template-columns: repeat(2, 1fr); }
    .m-sec { padding: 28px 16px; }
  }
  @media print {
    .addr, .atari-tag, .anim-note { display: none !important; }
    body { background: #fff; }
    .mock { box-shadow: none; border-radius: 0; }
    .reveal { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<div class="mock" data-columns="1col" data-archetype="stack-centered" data-section-order="SNS" data-nav-position="below-hero">

  <div class="sec reveal">
    <div class="addr"><span class="pin">MV-01</span></div>
    <div class="m-hero" data-hero="overlap">
      <div class="hero-img atari"><span class="ic">📷</span><span class="desc">淹れたてコーヒーと焼き菓子の横長ビジュアル</span></div>
      <div class="hero-text">
        <h1 class="catch">今日のひと息に。</h1>
        <p class="lead">自家焙煎の一杯と季節の焼き菓子。ゆっくり流れる時間をどうぞ。</p>
        <span class="hero-cta">メニューを見る ＞</span>
      </div>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">NAV-01</span></div>
    <div class="m-nav">
      <span class="logo">SAMPLE CAFE</span>
      <ul><li>MENU</li><li>SNS</li><li>CONTACT</li></ul>
      <span class="cta">ご予約</span>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">SNS-01</span></div>
    <div class="m-sec">
      <h2>SNS</h2><div class="en">Instagram</div>
      <div class="m-sns sns-masonry">
        <div class="atari"><span class="ic">📷</span><span class="desc">看板メニュー</span></div>
        <div class="atari"><span class="ic">📷</span><span class="desc">店内</span></div>
        <div class="atari"><span class="ic">📷</span><span class="desc">焼き菓子</span></div>
        <div class="atari"><span class="ic">📷</span><span class="desc">ラテアート</span></div>
        <div class="atari"><span class="ic">📷</span><span class="desc">テラス席</span></div>
        <div class="atari"><span class="ic">📷</span><span class="desc">季節限定</span></div>
        <div class="atari"><span class="ic">📷</span><span class="desc">スタッフ</span></div>
      </div>
      <div class="sec-more"><a class="sec-more-btn" href="#">投稿をもっと見る ＞</a></div>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">FOOTER-01</span></div>
    <div class="m-foot">
      <div class="fnav">MENU ・ SNS ・ CONTACT<br>© SAMPLE CAFE</div>
    </div>
  </div>

</div>

<script>
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (ens) { ens.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }); }, { threshold: .12 });
    els.forEach(function (e) { io.observe(e); });
  })();
</script>

</body>
</html>
