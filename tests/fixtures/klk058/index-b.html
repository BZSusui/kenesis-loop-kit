<!DOCTYPE html>
<!--
  KLK-058 ゴールデン（CTA マルチボタン・案B / letter=b）— §4.4
  CTA ボタン3個・全て短文で同程度 → 横並び row（.cta-btns row）。ボタンは静的アタリ（href=#・実送信/外部URL なし・NFR-005）。
  これはテスト検証用のプレースホルダ出力です。実在の顧客・案件ではありません（サンプル）。
  案件名: サンプルスクール / カラム: 1col / nav: top / CTA=buttons×3 row
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプルスクール | デザインラフ 案B（CTA×3）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; line-height: 1.7; }
  .mock { --m-main: #22475f; --m-nav: #16303f; --m-accent: #b78b3f; --m-bg: #f2f0ea; --m-text: #2c2a26; background: var(--m-bg); color: var(--m-text); overflow: hidden; position: relative; }
  .sec { position: relative; }
  .addr { position: absolute; top: 8px; left: 8px; z-index: 5; display: inline-flex; gap: 6px; align-items: center; }
  .addr .pin { background: rgba(17,24,39,.82); color: #fff; font-size: 10px; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; font-family: ui-monospace, monospace; }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

  .m-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: var(--m-nav); color: #fff; }
  .m-nav .logo { font-size: 17px; font-weight: 700; letter-spacing: .08em; }
  .m-nav ul { display: flex; gap: 16px; list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .m-nav .cta { background: var(--m-accent); color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 12px; }

  .m-hero { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 320px; padding: 40px 20px; color: #fff;
    background: linear-gradient(rgba(22,48,63,.45), rgba(22,48,63,.45)), repeating-linear-gradient(45deg, var(--m-main), var(--m-main) 14px, color-mix(in srgb, var(--m-main) 88%, #000) 14px, color-mix(in srgb, var(--m-main) 88%, #000) 28px); }
  .m-hero .catch { font-size: 28px; font-weight: 700; letter-spacing: .08em; margin: 0 0 12px; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .m-hero .lead { font-size: 14px; max-width: 520px; margin: 0; }
  .atari-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; }

  /* CTA 帯＋マルチボタン整列（§4.4・KLK-058） */
  .m-cta { background: var(--m-main); color: #fff; text-align: center; padding: 48px 22px; }
  .m-cta h2 { font-size: 24px; margin: 0 0 8px; color: #fff; }
  .m-cta p { margin: 0 auto 22px; font-size: 14px; opacity: .92; max-width: 560px; }
  .m-cta .cta-btns { display: grid; justify-content: center; gap: 12px; }
  .m-cta .cta-btns.single { grid-auto-flow: column; }
  .m-cta .cta-btns.row { grid-auto-flow: column; grid-auto-columns: minmax(150px, max-content); }
  .m-cta .cta-btns.stack { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
  .m-cta .cta-btns.grid2 { grid-template-columns: 1fr 1fr; max-width: 520px; margin: 0 auto; }
  .m-cta .cta-btns.two-plus-one { grid-template-columns: 1fr 1fr; max-width: 520px; margin: 0 auto; }
  .m-cta .cta-btns.two-plus-one .wide { grid-column: 1 / -1; }
  .m-cta .cta-btn { display: inline-flex; align-items: center; justify-content: center; background: var(--m-accent); color: #fff; padding: 14px 26px; border-radius: 4px; font-size: 14px; font-weight: 700; text-align: center; }
  .todo { color: #FFD9D9; font-size: 11px; }

  .m-foot { background: var(--m-nav); color: #fff; text-align: center; padding: 30px 20px; }
  .m-foot .fnav { font-size: 11px; opacity: .85; }

  @media (max-width: 640px) {
    .m-nav ul { display: none; }
    .m-nav::after { content: "\2630"; color: #fff; font-size: 20px; }
    .m-hero .catch { font-size: 24px; }
    .m-cta .cta-btns.row, .m-cta .cta-btns.grid2, .m-cta .cta-btns.two-plus-one { grid-auto-flow: row; grid-template-columns: 1fr; max-width: 360px; }
  }
  @media print {
    .addr, .atari-tag, .anim-note { display: none !important; }
    body { background: #fff; }
    .mock { box-shadow: none; border-radius: 0; }
    .reveal { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<div class="mock" data-columns="1col" data-archetype="stack-centered" data-section-order="CTA" data-nav-position="top">

  <div class="sec reveal">
    <div class="addr"><span class="pin">NAV-01</span></div>
    <div class="m-nav">
      <span class="logo">SAMPLE SCHOOL</span>
      <ul><li>コース</li><li>料金</li><li>アクセス</li></ul>
      <span class="cta">資料請求</span>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">MV-01</span></div>
    <div class="m-hero" data-hero="full">
      <h1 class="catch">学びを、はじめよう。</h1>
      <p class="lead">あなたのペースで続けられるカリキュラム。まずは気軽にお試しください。</p>
      <span class="atari-tag">📷 アタリ: 教室の全幅ビジュアル / 検索: school classroom bright</span>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">CTA-01</span></div>
    <div class="m-cta">
      <h2>次のアクションを選ぶ</h2>
      <p>ご希望に合わせてお選びください。</p>
      <div class="cta-btns row">
        <a class="cta-btn" href="#">資料請求</a>
        <a class="cta-btn" href="#">無料体験</a>
        <a class="cta-btn" href="#">説明会予約</a>
      </div>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">FOOTER-01</span></div>
    <div class="m-foot">
      <div class="fnav">コース ・ 料金 ・ アクセス<br>© SAMPLE SCHOOL</div>
    </div>
  </div>

</div>

<script>
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (ens) { ens.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }); }, { threshold: .12 });
    els.forEach(function (e) { io.observe(e); });
  })();
</script>

</body>
</html>
