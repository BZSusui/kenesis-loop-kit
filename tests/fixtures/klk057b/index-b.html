<!DOCTYPE html>
<!--
  KLK-057 副ゴールデン（HERO 埋め込み検索窓・案B / letter=b）— §12.1.3(7)・方式B
  SEARCH が sections に含まれない → HERO 埋め込み検索窓は「非生成」（コメントアウトではなく出力しない）。HERO=full は素の状態。SEARCH-01 も無し。
  「未選択なら不可視（非生成）」を実演。
  これはテスト検証用のプレースホルダ出力です。実在の顧客・案件ではありません（サンプル）。
  案件名: サンプルトラベル / カラム: 1col / nav: top / archetype=stack-centered / HERO=full（検索窓なし）/ sections=ABOUT のみ
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプルトラベル | デザインラフ 案B（検索窓なし）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; line-height: 1.7; }
  .mock { --m-main: #22475f; --m-nav: #16303f; --m-accent: #b78b3f; --m-bg: #f2f0ea; --m-text: #2c2a26; background: var(--m-bg); color: var(--m-text); overflow: hidden; position: relative; }
  .sec { position: relative; }
  .addr { position: absolute; top: 8px; left: 8px; z-index: 5; display: inline-flex; gap: 6px; align-items: center; }
  .addr .pin { background: rgba(17,24,39,.82); color: #fff; font-size: 10px; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; font-family: ui-monospace, monospace; }
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

  .m-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: var(--m-nav); color: #fff; }
  .m-nav .logo { font-size: 17px; font-weight: 700; letter-spacing: .08em; }
  .m-nav ul { display: flex; gap: 16px; list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .m-nav .cta { background: var(--m-accent); color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 12px; }

  /* HERO 型: full（検索窓なし＝SEARCH 未選択のため .hero-search を出力しない） */
  .m-hero { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 360px; padding: 40px 20px; color: #fff;
    background: linear-gradient(rgba(22,48,63,.42), rgba(22,48,63,.42)), repeating-linear-gradient(45deg, var(--m-main), var(--m-main) 14px, color-mix(in srgb, var(--m-main) 88%, #000) 14px, color-mix(in srgb, var(--m-main) 88%, #000) 28px); }
  .m-hero .catch { font-size: 30px; font-weight: 700; letter-spacing: .08em; margin: 0 0 12px; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .m-hero .lead { font-size: 15px; max-width: 520px; margin: 0 0 20px; }
  .m-hero .hero-cta { background: var(--m-accent); color: #fff; padding: 12px 30px; border-radius: 4px; font-size: 14px; }
  .atari-tag { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; }

  .m-sec { padding: 40px 24px; max-width: 940px; margin: 0 auto; }
  .m-sec h2 { text-align: center; font-size: 22px; letter-spacing: .1em; margin: 0 0 4px; color: var(--m-main); }
  .m-sec .en { text-align: center; font-size: 11px; letter-spacing: .3em; color: var(--m-accent); margin-bottom: 22px; font-family: ui-monospace, monospace; }
  .todo { color: #B54; background: #FFF0F0; border: 1px dashed #E39; border-radius: 4px; padding: 1px 6px; font-size: 12.5px; }

  .atari { background: linear-gradient(135deg, color-mix(in srgb, var(--m-main) 22%, #fff), color-mix(in srgb, var(--m-accent) 26%, #fff)); border: 1px dashed color-mix(in srgb, var(--m-main) 45%, #999); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: color-mix(in srgb, var(--m-main) 55%, #333); padding: 12px; gap: 4px; }
  .atari .ic { font-size: 20px; }
  .atari .desc { font-size: 12px; font-weight: 600; }
  .m-about.img-left { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
  .m-about.img-left .atari { min-height: 200px; }
  .m-about .txt h3 { font-size: 18px; color: var(--m-main); margin: 0 0 10px; }
  .m-about .txt p { font-size: 13.5px; margin: 0; }

  .m-foot { background: var(--m-nav); color: #fff; text-align: center; padding: 30px 20px; }
  .m-foot .fnav { font-size: 11px; opacity: .85; }

  @media (max-width: 640px) {
    .m-nav ul { display: none; }
    .m-nav::after { content: "\2630"; color: #fff; font-size: 20px; }
    .m-hero .catch { font-size: 24px; }
    .m-about.img-left { grid-template-columns: 1fr; }
    .m-sec { padding: 28px 16px; }
  }
  @media print {
    .addr, .atari-tag, .anim-note { display: none !important; }
    body { background: #fff; }
    .mock { box-shadow: none; border-radius: 0; }
    .reveal { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<div class="mock" data-columns="1col" data-archetype="stack-centered" data-section-order="ABOUT" data-nav-position="top">

  <div class="sec reveal">
    <div class="addr"><span class="pin">NAV-01</span></div>
    <div class="m-nav">
      <span class="logo">SAMPLE TRAVEL</span>
      <ul><li>ツアー</li><li>宿</li><li>特集</li></ul>
      <span class="cta">マイページ</span>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">MV-01</span></div>
    <div class="m-hero" data-hero="full">
      <h1 class="catch">次の旅は、どこにする？</h1>
      <p class="lead">人気の宿・ツアーを、写真とクチコミでかんたんに。</p>
      <span class="hero-cta">ツアーを見る ＞</span>
      <span class="atari-tag">📷 アタリ: 旅先の全幅ビジュアル / 検索: travel destination scenic</span>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">ABOUT-01</span></div>
    <div class="m-sec" style="background:#fff; margin:40px auto">
      <h2>ABOUT</h2><div class="en">サービスについて</div>
      <div class="m-about img-left">
        <div class="atari"><span class="ic">📷</span><span class="desc">旅のイメージ写真</span></div>
        <div class="txt">
          <h3>旅えらびを、もっとかんたんに</h3>
          <p>宿・ツアー・交通をまとめて比較・検索。あなたにぴったりの旅が見つかります。<span class="todo">(要検討)</span></p>
        </div>
      </div>
    </div>
  </div>

  <div class="sec reveal">
    <div class="addr"><span class="pin">FOOTER-01</span></div>
    <div class="m-foot">
      <div class="fnav">ツアー ・ 宿 ・ 特集<br>© SAMPLE TRAVEL</div>
    </div>
  </div>

</div>

<script>
  (function () {
    var els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (ens) { ens.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }); }, { threshold: .12 });
    els.forEach(function (e) { io.observe(e); });
  })();
</script>

</body>
</html>
