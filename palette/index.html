<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ムードカラー ジェネレーター v1.0</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e3e6ea;
    --ink: #1f2933;
    --muted: #6b7480;
    --accent: #3b6ef6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  header {
    padding: 28px 20px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 16px 60px;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 20px;
  }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .panel h2 {
    font-size: 13px;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 12px;
    text-transform: uppercase;
  }
  /* 折りたたみセクション */
  .sec { border-bottom: 1px solid var(--line); }
  .sec:last-of-type { border-bottom: 0; }
  .sec > summary {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 2px;
    cursor: pointer; user-select: none;
    list-style: none;
  }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec > summary::before {
    content: '▸';
    color: var(--muted); font-size: 11px;
    transition: transform .15s;
  }
  .sec[open] > summary::before { transform: rotate(90deg); }
  .sec .sec-title {
    flex: 1;
    font-size: 13px; letter-spacing: .04em;
    color: var(--muted); text-transform: uppercase;
  }
  .sec .sum-state {
    font-size: 11px; font-weight: 600; color: var(--accent);
    max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sec .sec-body { padding: 2px 2px 16px; }
  .sec-tools { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .sec-tools button {
    flex: 0 0 auto;
    padding: 4px 12px;
    font-size: 11px; font-weight: 500;
    border: 1px solid var(--line); border-radius: 999px;
    background: #fff; color: var(--muted);
    cursor: pointer;
  }
  .sec-tools button:hover { color: var(--ink); border-color: var(--muted); }

  .kw-group { margin-bottom: 14px; }
  .kw-group > span {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    position: relative;
    cursor: pointer;
    user-select: none;
  }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-block;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    background: #fbfbfc;
    transition: .15s;
  }
  .chip input:checked + span {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .chip.color i {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: -1px;
    border: 1px solid rgba(0,0,0,.18);
  }
  .chip.color i.none {
    background: #fff;
    background-image: linear-gradient(135deg, transparent 44%, #e35050 44%, #e35050 56%, transparent 56%);
  }
  /* ゴールド・シルバーの色味サブ選択 */
  .mv {
    flex-basis: 100%;
    margin-top: 6px; padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .mv[hidden], .mv-group[hidden] { display: none; }
  .mv-group > span {
    display: block;
    font-size: 12px; color: var(--muted);
    margin-bottom: 6px;
  }
  .slider { margin: 16px 0; }
  .slider label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .slider input[type=range] { width: 100%; }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1;
    padding: 11px;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #gen { background: var(--accent); color: #fff; }
  #reset { background: #eef0f3; color: var(--ink); flex: 0 0 auto; padding: 11px 16px; }

  .basecolor { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .basecolor .toggle { flex-basis: 100%; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .basecolor input[type=color] {
    width: 40px; height: 34px; padding: 0; border: 1px solid var(--line);
    border-radius: 8px; background: none; cursor: pointer;
  }
  .basecolor input[type=text] {
    flex: 1; min-width: 110px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
  }
  .basecolor.off input[type=color],
  .basecolor.off input[type=text] { opacity: .4; pointer-events: none; }
  .basecolor .presets { flex-basis: 100%; display: flex; gap: 6px; flex-wrap: wrap; }
  .basecolor .presets button {
    flex: 0 0 auto; padding: 5px 10px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--line); border-radius: 999px; background: #fff;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .basecolor .presets button i {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.18); display: inline-block;
  }
  .basecolor.off .presets { opacity: .4; pointer-events: none; }
  .basecolor + .basecolor { margin-top: 14px; }

  /* カラーチップ微調整モーダル */
  .editor-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15, 20, 26, .45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .editor-overlay[hidden] { display: none; }
  .editor {
    background: var(--card); border-radius: 14px;
    width: 300px; max-width: 100%;
    padding: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
  }
  .editor-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .editor-head b { font-size: 13px; }
  .editor-head button {
    flex: 0 0 auto; background: none; border: 0;
    font-size: 18px; line-height: 1; cursor: pointer;
    color: var(--muted); padding: 2px 6px;
  }
  .editor-swatch {
    height: 64px; border-radius: 10px; border: 1px solid var(--line);
    display: flex; align-items: flex-end; padding: 8px 10px;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    margin-bottom: 10px;
  }
  .editor input[type=text] {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    margin-bottom: 4px;
  }
  .editor .btn-row { margin-top: 12px; }
  .editor .btn-row button { background: #eef0f3; color: var(--ink); font-size: 13px; padding: 9px; flex: 1; }
  .editor .btn-row #edCopy { background: var(--accent); color: #fff; }
  .editor-note { margin: 10px 0 0; font-size: 11px; color: var(--muted); }

  .toggle-row {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 13px; cursor: pointer;
  }
  .toggle-row input { margin-top: 4px; }

  /* 可読性チェック（コントラスト比バッジ） */
  .contrast-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--line);
  }
  .contrast-row > small { color: var(--muted); font-size: 11px; margin-right: 2px; }
  .cbadge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600;
    cursor: default;
  }
  .cbadge.aaa { background: #e2f5e9; color: #157f3d; }
  .cbadge.aa  { background: #e3effd; color: #1d5fbf; }
  .cbadge.lg  { background: #fdf0dd; color: #b26a00; }
  .cbadge.ng  { background: #fde3e3; color: #c22525; }

  .patterns { display: grid; gap: 16px; }
  .pattern {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .pattern-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .pattern-head b { font-size: 14px; flex: 0 0 auto; }
  .pattern-head small { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; text-align: right; margin: 0 10px; }
  .pattern-head .css-copy {
    flex: 0 0 auto;
    padding: 5px 12px;
    font-size: 11px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 999px;
    background: #fff; color: var(--muted);
    cursor: pointer;
  }
  .pattern-head .css-copy:hover { color: var(--ink); border-color: var(--muted); }
  .swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sw {
    aspect-ratio: 3 / 2;
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px;
    cursor: pointer;
    position: relative;
  }
  .sw .role {
    font-size: 11px;
    opacity: .85;
    font-weight: 600;
  }
  .sw .hex {
    font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 0;
  }
  .sw:hover { outline: 2px solid rgba(0,0,0,.25); outline-offset: -2px; }
  /* 70:25:5 の面積比バー */
  .ratio-bar { display: flex; border-top: 1px solid var(--line); }
  .ratio-bar span {
    display: flex; align-items: center; justify-content: center;
    height: 20px; font-size: 10px; font-weight: 600;
    overflow: hidden; white-space: nowrap;
  }

  /* モック例の見出し（スウォッチ・比率バーとモックを分離する白帯） */
  .mock-head {
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 8px 16px;
    font-size: 11px; letter-spacing: .04em; font-weight: 600;
    color: var(--muted);
  }

  /* サイト風モックプレビュー（余白を吸収して伸びる） */
  .mock {
    flex: 1;
    display: flex; flex-direction: column;
    border-top: 1px solid var(--line);
    min-height: 190px;
  }
  .mock-nav {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 6px;
    padding: 8px 14px;
  }
  .mock-nav b {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; letter-spacing: .06em;
  }
  .mock-logo-mark {
    width: 14px; height: 14px; border-radius: 4px;
    display: inline-block; flex: 0 0 auto;
  }
  .mock-gnav { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 10px; }
  .mock-gnav > span { opacity: .75; }
  .mock-gnav .mock-navbtn {
    opacity: 1;
    padding: 4px 10px; border-radius: 5px; font-weight: 600;
  }
  .mock-hero {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    padding: 12px 14px;
  }
  .mock-hero b { font-size: 15px; }
  .mock-hero small { font-size: 11px; opacity: .8; }
  .mock-btn {
    align-self: flex-start;
    font-size: 11px; font-weight: 600;
    padding: 6px 14px; border-radius: 6px; margin-top: 4px;
  }
  .mock-cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    padding: 0 14px 12px;
  }
  .mock-card {
    border-radius: 6px; padding: 8px;
    font-size: 10px; min-height: 42px;
  }
  .mock-footer { padding: 6px 14px; font-size: 10px; }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--line);
    border-radius: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>ムードカラー ジェネレーター</h1>
  <p>言葉と割合から、メイン / サブ / アクセント / 背景の配色を3案つくります</p>
</header>

<div class="wrap">
  <!-- 入力パネル -->
  <div class="panel">
    <details class="sec" open>
      <summary><span class="sec-title">メインカラーの傾向（カラー）</span><span class="sum-state" id="sumColor"></span></summary>
      <div class="sec-body">
        <div id="colorfam" class="chips"></div>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">トーン（色調）</span><span class="sum-state" id="sumTone"></span></summary>
      <div class="sec-body">
        <div id="tones" class="chips"></div>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">言葉を選ぶ</span><span class="sum-state" id="sumKw"></span></summary>
      <div class="sec-body">
        <div id="keywords"></div>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">基準カラー（任意）</span><span class="sum-state" id="sumBase"></span></summary>
      <div class="sec-body">
        <div class="basecolor off" id="basecolor">
          <label class="toggle"><input type="checkbox" id="useBase"> メインカラーを指定して基準にする</label>
          <input type="color" id="basePick" value="#3b6ef6">
          <input type="text" id="baseHex" value="#3b6ef6" spellcheck="false">
        </div>
        <div class="basecolor off" id="accentcolor">
          <label class="toggle"><input type="checkbox" id="useAccent"> アクセントカラーを指定して固定する</label>
          <input type="color" id="accentPick" value="#e8590c">
          <input type="text" id="accentHex" value="#e8590c" spellcheck="false">
        </div>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">背景カラー（任意）</span><span class="sum-state" id="sumBg"></span></summary>
      <div class="sec-body">
        <div class="basecolor off" id="bgcolor">
          <label class="toggle"><input type="checkbox" id="useBg"> 背景色を指定する（白・薄ベージュなど）</label>
          <input type="color" id="bgPick" value="#faf8f3">
          <input type="text" id="bgHex" value="#faf8f3" spellcheck="false">
          <div class="presets" id="bgPresets"></div>
        </div>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">配色の傾向</span><span class="sum-state" id="sumMood"></span></summary>
      <div class="sec-body">
        <label class="toggle-row">
          <input type="checkbox" id="sameHue">
          同系色でまとめる（アクセントを補色にせず、メインと同系統の色相に寄せる）
        </label>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">割合を決める</span><span class="sum-state" id="sumRatio"></span></summary>
      <div class="sec-body">
        <div class="sec-tools">
          <button type="button" id="sliderReset">スライダーを初期値に戻す</button>
        </div>
        <div class="slider">
          <label><span>暖色</span><span>寒色</span></label>
          <input type="range" id="warm" min="-100" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>男性向け</span><span>女性向け</span></label>
          <input type="range" id="gender" min="-100" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>カジュアル</span><span>フォーマル</span></label>
          <input type="range" id="formal" min="-100" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>暗い</span><span>明るい</span></label>
          <input type="range" id="light" min="-100" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>モノクロ</span><span>ビビッド</span></label>
          <input type="range" id="vivid" min="-100" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>純色</span><span>中間色（くすみ）</span></label>
          <input type="range" id="muted" min="0" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>低コントラスト</span><span>高コントラスト</span></label>
          <input type="range" id="contrast" min="-100" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>キッズ</span><span>シニア</span></label>
          <input type="range" id="age" min="-100" max="100" value="0">
        </div>
        <div class="slider">
          <label><span>春・夏</span><span>秋・冬</span></label>
          <input type="range" id="season" min="-100" max="100" value="0">
        </div>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">表示モード</span><span class="sum-state" id="sumDisp"></span></summary>
      <div class="sec-body">
        <div id="dispmode" class="chips">
          <label class="chip"><input type="radio" name="dispmode" value="auto" checked><span>自動</span></label>
          <label class="chip"><input type="radio" name="dispmode" value="light"><span>ライト</span></label>
          <label class="chip"><input type="radio" name="dispmode" value="dark"><span>ダーク</span></label>
        </div>
      </div>
    </details>

    <details class="sec">
      <summary><span class="sec-title">色覚多様性チェック</span><span class="sum-state" id="sumCvd"></span></summary>
      <div class="sec-body">
        <label class="toggle-row">
          <input type="checkbox" id="cvdCheck">
          色の区別しにくさを判定する（P型・D型の色覚をシミュレートし、見分けにくい組み合わせに警告を出す）
        </label>
      </div>
    </details>

    <div class="btn-row">
      <button id="gen">配色を生成</button>
      <button id="reset">リセット</button>
    </div>
  </div>

  <!-- 出力パネル -->
  <div id="output" class="patterns">
    <div class="empty">言葉を選ぶか、スライダーを動かして「配色を生成」を押してください。</div>
  </div>
</div>

<!-- カラーチップ微調整モーダル -->
<div id="editor" class="editor-overlay" hidden>
  <div class="editor">
    <div class="editor-head"><b id="edTitle">色を調整</b><button type="button" id="edClose" aria-label="閉じる">×</button></div>
    <div class="editor-swatch" id="edSwatch"><span id="edHexLabel"></span></div>
    <input type="text" id="edHex" spellcheck="false">
    <div class="slider">
      <label><span>色相 H</span><span id="edHv"></span></label>
      <input type="range" id="edH" min="0" max="360" value="0">
    </div>
    <div class="slider">
      <label><span>彩度 S</span><span id="edSv"></span></label>
      <input type="range" id="edS" min="0" max="100" value="0">
    </div>
    <div class="slider">
      <label><span>明度 L</span><span id="edLv"></span></label>
      <input type="range" id="edL" min="0" max="100" value="0">
    </div>
    <div class="btn-row">
      <button type="button" id="edCopy">HEXをコピー</button>
      <button type="button" id="edReset">元に戻す</button>
    </div>
    <p class="editor-note">※ 配色を再生成すると微調整はリセットされます</p>
  </div>
</div>

<script>
/* ===== キーワード辞書 =====================================================
   各語に、色相(h)・彩度(s 0-1)・明度(l 0-1)の傾向と、
   3軸(warm: 暖-寒, gender: 男-女, formal: カジュアル-フォーマル)の寄与を持たせる。
   軸は -1(左) 〜 +1(右)。ここが「言葉→色」の心臓部で、ここを育てていく。 */
const KEYWORDS = {
  '印象': {
    'きれい':   { h: 200, s: .50, l: .66, warm: -.3, gender: +.2, formal: +.3 },
    'かわいい': { h: 340, s: .70, l: .76, warm: +.4, gender: +.9, formal: -.6 },
    '上品':     { h: 300, s: .30, l: .60, warm:  0,  gender: +.4, formal: +.7 },
    'クール':   { h: 205, s: .58, l: .42, warm: -.7, gender: -.4, formal: +.4 },
    'さわやか': { h: 165, s: .58, l: .64, warm: -.3, gender: +.1, formal: -.1 },
    '楽しい':   { h:  48, s: .85, l: .64, warm: +.5, gender: +.2, formal: -.8 },
    '清楚':     { h: 190, s: .28, l: .80, warm: -.2, gender: +.4, formal: +.3 },
    '華やか':   { h: 330, s: .72, l: .62, warm: +.3, gender: +.6, formal: -.1 },
    'シンプル': { h: 210, s: .10, l: .72, warm: -.1, gender:  0,  formal: +.5 },
    'ポップ':   { h:  55, s: .90, l: .66, warm: +.5, gender: +.2, formal: -.9 },
  },

/* ===== ユーティリティ ==================================================== */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const wrap  = (h) => ((h % 360) + 360) % 360;

// シード付き乱数（同じシードなら同じ結果 → 「別案」を再現・共有できる素地）
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// -amt 〜 +amt の微ゆらぎ（色相・彩度・明度に「案ごとの揺れ」を与える）
const jit = (rng, amt) => (rng() * 2 - 1) * amt;

// 金属帯クランプ: H は variant.h ± hTol の最短差で丸め、S/L は帯へ収める。
// makePatterns の戻り値直前（applyContrast より後）に main のみへ適用する最終段ガード。
function clampMetalBand(col, variant, isDarkBg) {
  const b = variant.band;
  const d = ((col[0] - variant.h + 540) % 360) - 180;      // 最短方向の色相差
  const H = wrap(variant.h + clamp(d, -b.hTol, b.hTol));
  const lb = isDarkBg ? b.lDark : b.l;
  return [H, clamp(col[1], b.s[0], b.s[1]), clamp(col[2], lb[0], lb[1])];
}

// 金属光沢の参考表現: 単色HSLから4ストップの斜めグラデを合成する。
// 表示（チップ見本・スウォッチ・モック）専用。データ・出力HEXは単色のまま。
function metalGrad(h, s, l) {
  const hi  = hslToHex(h, s, clamp(l + .18, 0, .95));      // ハイライト
  const mid = hslToHex(h, s, l);                           // 地の色（=出力HEXと同一）
  const lo  = hslToHex(h, s * .9, clamp(l - .14, .05, 1)); // 陰
  return `linear-gradient(135deg, ${hi} 0%, ${mid} 38%, ${lo} 62%, ${hslToHex(h, s, clamp(l + .10, 0, .95))} 100%)`;
}

// 色相の平均は円環なので、単位ベクトルに直して平均する
function circularMean(hues) {
  let x = 0, y = 0;
  for (const h of hues) { x += Math.cos(h * Math.PI / 180); y += Math.sin(h * Math.PI / 180); }
  let a = Math.atan2(y, x) * 180 / Math.PI;
  return (a + 360) % 360;
}
// h1 から h2 へ、比率 t(0-1) だけ最短方向に回す
function blendHue(h1, h2, t) {
  let d = ((h2 - h1 + 540) % 360) - 180;
  return (h1 + d * t + 360) % 360;
}
function hslToHex(h, s, l) {
  s = clamp(s, 0, 1); l = clamp(l, 0, 1);
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60)      [r, g, b] = [c, x, 0];
  else if (h < 120)[r, g, b] = [x, c, 0];
  else if (h < 180)[r, g, b] = [0, c, x];
  else if (h < 240)[r, g, b] = [0, x, c];
  else if (h < 300)[r, g, b] = [x, 0, c];
  else             [r, g, b] = [c, 0, x];
  const to = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
  return '#' + to(r) + to(g) + to(b);
}
// #RRGGBB → {h,s,l}（基準カラー指定を種に使うため）
function hexToHsl(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const l = (max + min) / 2;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return { h, s, l };
}
// 背景色に対して読みやすい文字色（白/黒）を返す
function textOn(hex) {
  const r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#1f2933' : '#ffffff';
}

/* ===== 可読性チェック（WCAGコントラスト比） ==============================
   WCAG 2.x の相対輝度式でコントラスト比(1〜21)を算出し、
   AAA(7:1以上) / AA(4.5:1以上) / 大文字のみ可(3:1以上) / ✕ で判定する。 */
function wcagLum(hex) {
  const ch = (i) => {
    const v = parseInt(hex.substr(i, 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * ch(1) + 0.7152 * ch(3) + 0.0722 * ch(5);
}
function contrastRatio(hex1, hex2) {
  const a = wcagLum(hex1), b = wcagLum(hex2);
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
}
function contrastBadge(label, fg, bg) {
  const r = contrastRatio(fg, bg);
  let cls, judge;
  if (r >= 7)        { cls = 'aaa'; judge = 'AAA'; }
  else if (r >= 4.5) { cls = 'aa';  judge = 'AA'; }
  else if (r >= 3)   { cls = 'lg';  judge = '大文字のみ'; }
  else               { cls = 'ng';  judge = '✕'; }
  return `<span class="cbadge ${cls}" title="コントラスト比 ${r.toFixed(2)}:1（AAA≧7 / AA≧4.5 / 大文字≧3）">${label} ${r.toFixed(1)} ${judge}</span>`;
}

/* ===== 色覚多様性チェック ================================================
   P型(1型)・D型(2型)色覚の見え方を線形RGB上の変換行列(Machado et al. 2009)で
   シミュレートし、パレット内の色同士が見分けにくい組み合わせを検出する。 */
const CVD_MAT = {
  'P型': [0.152286, 1.052583, -0.204868,  0.114503, 0.786281, 0.099216,  -0.003882, -0.048116, 1.051998],
  'D型': [0.367322, 0.860646, -0.227968,  0.280085, 0.672501, 0.047413,  -0.011820,  0.042940, 0.968881],
};
function hexToLinRgb(hex) {
  const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return [lin(parseInt(hex.substr(1,2),16)), lin(parseInt(hex.substr(3,2),16)), lin(parseInt(hex.substr(5,2),16))];
}
function cvdSim(hex, m) {
  const [r, g, b] = hexToLinRgb(hex);
  const f = v => { v = clamp(v, 0, 1); return v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; };
  return [f(m[0]*r + m[1]*g + m[2]*b), f(m[3]*r + m[4]*g + m[5]*b), f(m[6]*r + m[7]*g + m[8]*b)];
}
function cvdBadge(cols) {
  const names = Object.keys(cols);
  const issues = [];
  for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
    for (const [type, m] of Object.entries(CVD_MAT)) {
      const a = cvdSim(cols[names[i]], m), b = cvdSim(cols[names[j]], m);
      const dist = Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
      const dLum = Math.abs((0.299*a[0] + 0.587*a[1] + 0.114*a[2]) - (0.299*b[0] + 0.587*b[1] + 0.114*b[2]));
      if (dist < 0.25 && dLum < 0.12) { issues.push(`${names[i]}×${names[j]}(${type})`); break; }
    }
  }
  if (!issues.length) {
    return `<span class="cbadge aaa" title="P型・D型の色覚シミュレーションで、パレット内の各色を区別できます">色覚 ✓</span>`;
  }
  return `<span class="cbadge ng" title="色覚シミュレーションで見分けにくい組み合わせです。明度差を付けるか、色以外(形・ラベル)でも区別できるデザインにしてください">色覚 ⚠ ${issues.join('・')}</span>`;
}

/* ===== 入力を集めて基準HSLを決める ====================================== */
function computeBase() {
  // チェックされた言葉を集める
  const checked = [];
  document.querySelectorAll('#keywords input:checked').forEach(el => {
    if (!el.value) return;                          // ジャンル「指定なし」radio を除外
    const [cat, key] = el.value.split('/');
    const def = KEYWORDS[cat] && KEYWORDS[cat][key];
    if (def) checked.push(def);                     // 未知値も黙って無視（URL復元の不正値対策を兼ねる）
  });

  // スライダー -1..1
  const warmS   = -(+document.getElementById('warm').value)   / 100; // 左(暖)を +warm にしたいので反転
  const genderS =  (+document.getElementById('gender').value) / 100; // 右(女性) = +
  const formalS =  (+document.getElementById('formal').value) / 100; // 右(フォーマル) = +
  const lightS  =  (+document.getElementById('light').value)  / 100; // 右(明るい) = +
  const vividS  =  (+document.getElementById('vivid').value)  / 100; // 右(ビビッド) = +
  const mutedS  =  (+document.getElementById('muted').value)  / 100; // 0(純色) 〜 1(くすみ)
  const contrastS = (+document.getElementById('contrast').value) / 100; // 右(高コントラスト) = +
  const ageS      = (+document.getElementById('age').value)      / 100; // 左(キッズ) = - / 右(シニア) = +
  const seasonS   = (+document.getElementById('season').value)   / 100; // 左(春夏) = - / 右(秋冬) = +
  const disp = document.querySelector('input[name=dispmode]:checked')?.value || 'auto';

  // 基準カラー（任意）: チェックONかつ有効な#hexなら、これを種にする
  const useBase = document.getElementById('useBase').checked;
  const baseHsl = useBase ? hexToHsl(document.getElementById('basePick').value) : null;

  // アクセントカラー（任意）: 指定されたら全案のアクセントをこの色に固定する
  const useAccent = document.getElementById('useAccent').checked;
  const accentOverride = useAccent ? hexToHsl(document.getElementById('accentPick').value) : null;

  // 背景カラー（任意）: 指定されたら3案すべての背景として使う
  const useBg = document.getElementById('useBg').checked;
  const bgOverride = useBg ? hexToHsl(document.getElementById('bgPick').value) : null;

  // --- 種となるHSLと軸平均を作る（優先度: 基準カラー > 言葉 > 中立）---
  let seedHue, seedS, seedL, kwWarm = 0, kwGender = 0, kwFormal = 0;
  if (checked.length) {
    kwWarm   = checked.reduce((a, k) => a + k.warm, 0)   / checked.length;
    kwGender = checked.reduce((a, k) => a + k.gender, 0) / checked.length;
    kwFormal = checked.reduce((a, k) => a + k.formal, 0) / checked.length;
  }
  // カラー（メインの色系統）の選択。基準カラーの次に優先する色相アンカー。
  const famKey = document.querySelector('input[name=colorfam]:checked')?.value || '';
  const fam = COLORS.find(c => c.key === famKey);
  // metallic: 基準カラー(baseHsl)指定時は従来どおり基準カラーが最優先（metallic扱いしない）
  const mvKey = fam?.metallic
    ? (document.querySelector(`input[name=mv-${fam.key}]:checked`)?.value || METALLICS[fam.key].variants[0].key)
    : null;
  const metallic = (!baseHsl && fam?.metallic)
    ? { famKey: fam.key, variant: METALLICS[fam.key].variants.find(v => v.key === mvKey) || METALLICS[fam.key].variants[0] }
    : null;

  if (baseHsl) {
    // 基準カラーを種に。色相はここで固定寄りにする（下のpullで弱めに扱う）
    seedHue = baseHsl.h; seedS = baseHsl.s; seedL = baseHsl.l;
  } else if (metallic) {
    // metallic: S/L の正は色味バリエーション（帯）。言葉による S/L 上書きはスキップし、
    // 言葉は3軸（kwWarm/kwGender/kwFormal）とスライダー経由でのみ寄与させる
    seedHue = metallic.variant.h; seedS = metallic.variant.s; seedL = metallic.variant.l;
  } else if (fam) {
    // カラー選択が最優先の色相アンカー。カラフルは生成のたび色相が変わる
    seedHue = fam.colorful ? (seed % 360) : fam.h;
    if (checked.length) { // 言葉があればトーン(彩度・明度)は言葉から取る
      seedS = checked.reduce((a, k) => a + k.s, 0) / checked.length;
      seedL = checked.reduce((a, k) => a + k.l, 0) / checked.length;
    } else {
      seedS = fam.s; seedL = fam.l;
    }
    if (fam.mono) seedS = 0.05; // モノトーンは無彩色寄り
  } else if (checked.length) {
    seedHue = circularMean(checked.map(k => k.h));
    seedS   = checked.reduce((a, k) => a + k.s, 0) / checked.length;
    seedL   = checked.reduce((a, k) => a + k.l, 0) / checked.length;
  } else {
    seedHue = 210; seedS = 0.55; seedL = 0.55; // 言葉なし → 中立の種
  }

  // 言葉とスライダーを合成した実効の3軸（-1..1）
  const warm   = clamp(kwWarm   * 0.5 + warmS   * (checked.length ? 0.6 : 1), -1, 1);
  const gender = clamp(kwGender * 0.5 + genderS * (checked.length ? 0.6 : 1), -1, 1);
  const formal = clamp(kwFormal * 0.5 + formalS * (checked.length ? 0.6 : 1), -1, 1);

  // --- 色相：暖/寒スライダーで暖色(30°)⇔寒色(215°)へ引っぱる ---
  // 基準カラー指定時は主色の色相をなるべく保つため引っぱりを弱める
  const warmTarget = warm >= 0 ? 30 : 215;
  const pull = Math.abs(warm) * (baseHsl ? 0.12 : (fam ? 0.15 : (checked.length ? 0.35 : 0.85)));
  let H = blendHue(seedHue, warmTarget, pull);

  // --- 彩度：フォーマル→下げ / 彩度スライダー / 中間色でくすませる ---
  let S = seedS * (1 - formal * 0.4);
  S = vividS >= 0 ? S + (1 - S) * vividS   // ビビッド寄り: 1へ近づける
                  : S * (1 + vividS);      // モノクロ寄り: 0へ近づける
  S = S * (1 - mutedS) + 0.30 * mutedS;    // 中間色: 彩度を鈍い値(0.30)へブレンド
  S = clamp(S + gender * 0.05, 0, 0.98);

  // --- 明度：女性→明るく / フォーマル→暗く / 明度スライダー / 中間色は中庸へ ---
  let L = seedL + gender * 0.10 - formal * 0.10;
  L = lightS >= 0 ? L + (0.92 - L) * lightS // 明るい方向
                  : L + (L - 0.12) * lightS; // 暗い方向(lightS<0)
  L = L * (1 - mutedS * 0.6) + 0.55 * (mutedS * 0.6); // くすみ: 中庸の明度へ寄せる
  L = clamp(L, 0.12, 0.92);

  // --- 年齢層: キッズ→鮮やか・明るく / シニア→彩度を抑える（可読性は下のコントラストで補強）---
  if (ageS < 0) {
    S = clamp(S + (0.95 - S) * (-ageS) * 0.35, 0, 0.98);
    L = clamp(L + (0.78 - L) * (-ageS) * 0.25, 0.12, 0.92);
  } else if (ageS > 0) {
    S = clamp(S * (1 - ageS * 0.35), 0, 0.98);
  }
  // --- 季節: 春夏→明るく澄んだ色 / 秋冬→暗く深みのある色 ---
  if (seasonS) {
    L = clamp(L - seasonS * 0.10, 0.12, 0.92);
    S = seasonS > 0 ? clamp(S * (1 - seasonS * 0.18), 0, 0.98)
                    : clamp(S + (0.92 - S) * (-seasonS) * 0.18, 0, 0.98);
  }
  // シニアは高コントラストが定石なので、実効コントラストを底上げする
  const contrast = clamp(contrastS + Math.max(0, ageS) * 0.35, -1, 1);

  const hasInput = checked.length > 0 || baseHsl || fam || bgOverride || accentOverride ||
    document.getElementById('sameHue').checked ||
    document.getElementById('cvdCheck').checked || disp !== 'auto' ||
    warmS || genderS || formalS || lightS || vividS || mutedS ||
    contrastS || ageS || seasonS;
  return { H, S, L, hasInput, bgOverride, accentOverride, contrast, disp, metallic };
}

/* ===== 同系色モード ======================================================
   「同系色でまとめる」ON時の後処理。スキームが作った sub/accent の色相を
   メイン近傍（sub: ±20° / accent: ±35°）へ圧縮し、色相差の代わりに
   彩度・明度の差でアクセントを成立させる。補色の派手さを抑えたマイルド版。 */
function toSameHue(c, H, S, L) {
  // hue をメイン(H)から range 以内に圧縮する（最短方向の差を比例縮小）
  const near = (hue, range) => {
    const d = ((hue - H + 540) % 360) - 180; // -180..180 の最短差
    return wrap(H + (d / 180) * range);
  };
  const sub = [near(c.sub[0], 20), c.sub[1], c.sub[2]];
  // アクセント: 色相はメイン寄り、彩度をやや上げ、明度をメインから離して差別化
  const aH = near(c.accent[0], 35);
  const aS = clamp(Math.max(c.accent[1], S + 0.12), 0, 0.92);
  const aL = L >= 0.5 ? clamp(L - 0.28, 0.15, 0.90)
                      : clamp(L + 0.30, 0.10, 0.90);
  return { main: c.main, sub, accent: [aH, aS, aL] };
}

/* ===== コントラスト強度 ==================================================
   スライダー(+)は背景との明度差を広げて可読性を上げ、
   (-)は背景の明度へ寄せて穏やかな(低コントラストな)配色にする。 */
function applyContrast(col, bgL, c, weight) {
  const t = Math.abs(c) * 0.5 * weight;
  let L2;
  if (c > 0) {
    const target = col[2] <= bgL ? 0.06 : 0.96; // 背景より暗い色は更に暗く、明るい色は更に明るく
    L2 = col[2] + (target - col[2]) * t;
  } else {
    L2 = col[2] + (bgL - col[2]) * t * 0.8;     // 背景の明度へ寄せる
  }
  return [col[0], col[1], clamp(L2, 0.05, 0.95)];
}

/* ===== 3パターン生成 ====================================================
   基準HSLから、配色理論の異なる3案を作る。乱数は使わず入力から一意に決まる。 */
function makePatterns(b, seed) {
  const { H, S, L } = b;
  const sameHue = document.getElementById('sameHue').checked;
  const rng = mulberry32(seed);
  // 背景色: 指定があればそれを全案に使う。無ければメインから自動生成。
  const bg = (mode) => {
    if (b.bgOverride) return [b.bgOverride.h, b.bgOverride.s, b.bgOverride.l]; // ユーザー指定を優先
    if (b.disp === 'dark') return [H, clamp(S * 0.45, 0, 0.5), 0.13];          // 表示モード: ダーク指定
    if (b.disp !== 'light' && L < 0.40) return [H, clamp(S * 0.45, 0, 0.5), 0.13]; // 自動: ダーク配色 → 暗い背景
    if (mode === 'neutral') return [H, clamp(S * 0.10, 0, 0.12), 0.97];
    if (mode === 'tint')    return [H, clamp(S * 0.28, 0, 0.32), 0.95];
    return [H, clamp(S * 0.20, 0, 0.25), 0.93];                      // soft
  };
  // 3案の元となるスキームを選ぶ。
  // metallic: 相性パートナー表（§定番ペア）をシャッフルして3案（既存SCHEMESは使わない）
  // 通常: SCHEMES をシャッフルして3つ選ぶ（クリックのたびに別の組み合わせ）
  let picks;
  if (b.metallic) {
    const v = b.metallic.variant;
    const famName = COLORS.find(c => c.key === b.metallic.famKey).name;
    const partners = v.partners.slice();
    for (let i = partners.length - 1; i > 0; i--) {
      const k = Math.floor(rng() * (i + 1));
      [partners[i], partners[k]] = [partners[k], partners[i]];
    }
    picks = partners.slice(0, 3).map(pt => ({
      name: `${famName}×${pt.name}`, note: '金属色×相性色の定番ペア',
      make: (H, S, L, rng) => ({
        // main はスライダー反映済みの S/L（色相は variant 近傍）。sub/accent はパートナー由来
        main:   [wrap(v.h + jit(rng, 4)), S, L],
        sub:    [wrap(pt.sub[0] + jit(rng, 6)), pt.sub[1], clamp(pt.sub[2] + jit(rng, 0.03), 0, 0.95)],
        accent: [wrap(pt.accent[0] + jit(rng, 6)), pt.accent[1], clamp(pt.accent[2] + jit(rng, 0.03), 0.05, 0.95)],
      }),
    }));
  } else {
    const pool = SCHEMES.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const k = Math.floor(rng() * (i + 1));
      [pool[i], pool[k]] = [pool[k], pool[i]];
    }
    picks = pool.slice(0, 3);
  }
  const modes = ['neutral', 'tint', 'soft'];
  return picks.map((sc, i) => {
    let c = sc.make(H, S, L, rng);
    let note = sc.note;
    if (sameHue) {
      c = toSameHue(c, H, S, L);
      note = '同系色モード: 色相を揃えて彩度・明度で差別化';
    }
    // アクセント固定: 指定色をそのまま使い、以降の自動調整はかけない
    const fixedAccent = !!b.accentOverride;
    if (fixedAccent) c.accent = [b.accentOverride.h, b.accentOverride.s, b.accentOverride.l];
    const bgc = bg(modes[i]);
    // ダークモード: 暗い背景に沈まないよう各色の明度を持ち上げる
    if (b.disp === 'dark' && !b.bgOverride) {
      const lift = col => [col[0], col[1], clamp(col[2] + (0.68 - col[2]) * 0.55, 0.40, 0.88)];
      c = { main: lift(c.main), sub: lift(c.sub), accent: fixedAccent ? c.accent : lift(c.accent) };
    }
    // コントラスト強度: 背景との明度差を調整（サブは弱めに）
    if (b.contrast) {
      c = {
        main:   applyContrast(c.main,   bgc[2], b.contrast, 1),
        sub:    applyContrast(c.sub,    bgc[2], b.contrast, 0.5),
        accent: fixedAccent ? c.accent : applyContrast(c.accent, bgc[2], b.contrast, 1),
      };
    }
    // metallic: 後段のどの変換が S/L を動かしても main は必ず金属帯内で確定する（最終段クランプ）
    if (b.metallic) {
      c.main = clampMetalBand(c.main, b.metallic.variant, bgc[2] < 0.45);
      return { name: sc.name, note, main: c.main, sub: c.sub, accent: c.accent, bg: bgc, metal: true };
    }
    return { name: sc.name, note, main: c.main, sub: c.sub, accent: c.accent, bg: bgc };
  });
}

/* ===== 描画 ============================================================== */
// 折りたたんだ見出しの右端に、現在の設定を要約表示する
function updateSummaries() {
  const set = (id, txt) => { document.getElementById(id).textContent = txt; };
  const famKey = document.querySelector('input[name=colorfam]:checked')?.value || '';
  const fam = COLORS.find(c => c.key === famKey);
  let sumColor = fam ? fam.name : '';
  if (fam?.metallic) { // metallic は「ゴールド（黄み）」形式で色味も要約する
    const mvKey = document.querySelector(`input[name=mv-${fam.key}]:checked`)?.value;
    const mv = METALLICS[fam.key].variants.find(v => v.key === mvKey) || METALLICS[fam.key].variants[0];
    sumColor = `${fam.name}（${mv.name}）`;
  }
  set('sumColor', sumColor);
  const toneKey = document.querySelector('input[name=tone]:checked')?.value || '';
  const tone = TONES.find(t => t.key === toneKey);
  set('sumTone', tone ? tone.name : '');
  const kw = [...document.querySelectorAll('#keywords input:checked')].filter(el => el.value).length;
  set('sumKw', kw ? `${kw}個選択` : '');
  const baseParts = [];
  if (document.getElementById('useBase').checked) baseParts.push(document.getElementById('baseHex').value);
  if (document.getElementById('useAccent').checked) baseParts.push('アクセント固定');
  set('sumBase', baseParts.join(' / '));
  set('sumBg', document.getElementById('useBg').checked ? document.getElementById('bgHex').value : '');
  set('sumMood', document.getElementById('sameHue').checked ? '同系色' : '');
  const moved = ['warm','gender','formal','light','vivid','muted','contrast','age','season']
    .some(id => +document.getElementById(id).value !== 0);
  set('sumRatio', moved ? '調整あり' : '');
  const disp = document.querySelector('input[name=dispmode]:checked')?.value;
  set('sumDisp', { light: 'ライト', dark: 'ダーク' }[disp] || '');
  set('sumCvd', document.getElementById('cvdCheck').checked ? 'ON' : '');
}

// 「別案」を決めるシード。ボタンで更新、スライダー調整中は保持する。
let seed = Math.floor(mulberry32(1234)() * 1e9) || 1;
// 生成結果を保持し、チップクリックの微調整モーダルから編集できるようにする
let currentPatterns = [];
let pristinePatterns = []; // 「元に戻す」用の生成直後スナップショット
const ROLE_NAMES = ['メイン', 'サブ', 'アクセント', '背景'];
const ROLE_KEYS  = ['main', 'sub', 'accent', 'bg'];
// 案の4色を CSS カスタムプロパティ形式で書き出す（常に単色HEX。微調整後の値も反映される）
function cssVarsOf(p) {
  const [main, sub, accent, bgc] = ROLE_KEYS.map(k => hslToHex(p[k][0], p[k][1], p[k][2]));
  return `:root {\n  --color-main: ${main};\n  --color-sub: ${sub};\n  --color-accent: ${accent};\n  --color-bg: ${bgc};\n}`;
}
function render() {
  updateSummaries();
  closeEditor();
  const b = computeBase();
  if (!b.hasInput) {
    currentPatterns = [];
    document.getElementById('output').innerHTML =
      '<div class="empty">言葉を選ぶか、スライダーを動かして「配色を生成」を押してください。</div>';
    return;
  }
  currentPatterns = makePatterns(b, seed);
  pristinePatterns = JSON.parse(JSON.stringify(currentPatterns));
  paintOutput();
}
function paintOutput() {
  const out = document.getElementById('output');
  out.innerHTML = currentPatterns.map((p, pi) => {
    const cols = ROLE_KEYS.map(k => hslToHex(p[k][0], p[k][1], p[k][2]));
    const [main, sub, accent, bgc] = cols;
    // metallic 案の参考表示: メインのグラデ（データ・HEX表記・コピー値は単色のまま）
    const mainGrad = p.metal ? metalGrad(p.main[0], p.main[1], p.main[2]) : null;
    // metallic 案のボタンは main のグラデ＋textOn(main)（金属CTAの定番見え）。通常案は accent
    const btnBg = p.metal ? mainGrad : accent;
    const btnFg = p.metal ? textOn(main) : textOn(accent);
    const swatches = cols.map((hex, i) => `
      <div class="sw" style="background:${i === 0 && mainGrad ? mainGrad : hex};color:${textOn(hex)}" data-p="${pi}" data-r="${i}" title="クリックで色を微調整">
        <span class="role">${ROLE_NAMES[i]}</span>
        <span class="hex">${hex.toUpperCase()}</span>
      </div>`).join('');
    // 70:25:5 の面積比バー（実務の目安: ベース70% / メイン25% / アクセント5%）
    const ratioBar = `
      <div class="ratio-bar" title="配色の面積比の目安: ベース(背景)70% / メイン25% / アクセント5%">
        <span style="flex:70;background:${bgc};color:${textOn(bgc)}">ベース 70%</span>
        <span style="flex:25;background:${main};color:${textOn(main)}">メイン 25%</span>
        <span style="flex:5;background:${accent};color:${textOn(accent)}" title="アクセント 5%">5</span>
      </div>`;
    // 実際の面積比に近いサイト風モック（背景=bg / 見出し・フッター=main / カード=sub / CTA=accent）
    const mock = `
      <div class="mock-head">モック例（実際の面積比での見え方）</div>
      <div class="mock" style="background:${bgc}">
        <div class="mock-nav" style="border-bottom:1px solid ${sub}">
          <b style="color:${main}"><i class="mock-logo-mark" style="background:${mainGrad || main}"></i>LOGO</b>
          <span class="mock-gnav">
            ${['MENU1', 'MENU2', 'MENU3', 'MENU4'].map(m =>
              `<span style="color:${textOn(bgc)}">${m}</span>`).join('')}
            <span class="mock-navbtn" style="background:${btnBg};color:${btnFg}">お問い合わせ</span>
          </span>
        </div>
        <div class="mock-hero">
          <b style="color:${main}">サイトの見出しテキスト</b>
          <small style="color:${textOn(bgc)}">本文のサンプルです。実際の面積比で配色の印象を確認できます。</small>
          <span class="mock-btn" style="background:${btnBg};color:${btnFg}">詳しく見る</span>
        </div>
        <div class="mock-cards">
          ${['サービス', '実績', 'お知らせ'].map(t =>
            `<div class="mock-card" style="background:${sub};color:${textOn(sub)}">${t}</div>`).join('')}
        </div>
        <div class="mock-footer" style="background:${main};color:${textOn(main)}">&copy; SAMPLE SITE</div>
      </div>`;
    // 可読性チェック: 実際に文字が載る組み合わせのコントラスト比を判定
    const cvdOn = document.getElementById('cvdCheck').checked;
    const contrastRow = `
      <div class="contrast-row">
        <small>可読性:</small>
        ${contrastBadge('本文×背景', textOn(bgc), bgc)}
        ${contrastBadge('見出し×背景', main, bgc)}
        ${p.metal ? contrastBadge('ボタン文字×ボタン', textOn(main), main)
                  : contrastBadge('ボタン文字×ボタン', textOn(accent), accent)}
        ${cvdOn ? cvdBadge({ 'メイン': main, 'サブ': sub, 'アクセント': accent }) : ''}
      </div>`;
    return `
      <div class="pattern">
        <div class="pattern-head"><b>${p.name}</b><small>${p.note}</small><button type="button" class="css-copy" data-p="${pi}">CSS変数をコピー</button></div>
        <div class="swatches">${swatches}</div>
        ${ratioBar}
        ${mock}
        ${contrastRow}
      </div>`;
  }).join('');

  // チップをクリックで微調整モーダルを開く
  out.querySelectorAll('.sw').forEach(sw => {
    sw.addEventListener('click', () => openEditor(+sw.dataset.p, +sw.dataset.r));
  });
  // 「CSS変数をコピー」: currentPatterns から都度 HEX を再計算するため微調整後の値が反映される
  out.querySelectorAll('.css-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard?.writeText(cssVarsOf(currentPatterns[+btn.dataset.p]));
      btn.textContent = '✓ コピーしました';
      setTimeout(() => { btn.textContent = 'CSS変数をコピー'; }, 900);
    });
  });
}

/* ===== 初期化 ============================================================ */
function buildColors() {
  const box = document.getElementById('colorfam');
  const none = `<label class="chip color">
      <input type="radio" name="colorfam" value="" checked><span><i class="none"></i>指定なし</span>
    </label>`;
  box.innerHTML = none + COLORS.map(c => {
    let dot;
    if (c.colorful) dot = 'background:conic-gradient(from 0deg,#ff5252,#ffb142,#fdd835,#66bb6a,#26c6da,#42a5f5,#7e57c2,#ff5252)';
    else if (c.mono) dot = 'background:#9aa0a6';
    else if (c.metallic) dot = 'background:' + metalGrad(c.h, c.s, c.l); // 金属風の見本ドット
    else dot = 'background:' + hslToHex(c.h, c.s, c.l);
    return `<label class="chip color">
        <input type="radio" name="colorfam" value="${c.key}"><span><i style="${dot}"></i>${c.name}</span>
      </label>`;
  }).join('') + `
    <div id="metallicVariant" class="mv" hidden>
      ${Object.entries(METALLICS).map(([mk, def]) => `
      <div class="mv-group" data-for="${mk}">
        <span>${def.label}</span>
        <div class="chips">
          ${def.variants.map((v, i) => `
          <label class="chip color">
            <input type="radio" name="mv-${mk}" value="${v.key}"${i === 0 ? ' checked' : ''}><span><i style="background:${metalGrad(v.h, v.s, v.l)}"></i>${v.name}</span>
          </label>`).join('')}
        </div>
      </div>`).join('')}
    </div>`;
}

// gold/silver 選択時のみ、対応する色味サブ選択（#metallicVariant）を表示する
function syncMetallicUI() {
  const famKey = document.querySelector('input[name=colorfam]:checked')?.value || '';
  const isMetal = !!COLORS.find(c => c.key === famKey)?.metallic;
  const box = document.getElementById('metallicVariant');
  box.hidden = !isMetal;
  box.querySelectorAll('.mv-group').forEach(g => { g.hidden = g.dataset.for !== famKey; });
}

function buildTones() {
  const box = document.getElementById('tones');
  const none = `<label class="chip color">
      <input type="radio" name="tone" value="" checked><span><i class="none"></i>指定なし</span>
    </label>`;
  box.innerHTML = none + TONES.map(t => `
    <label class="chip color">
      <input type="radio" name="tone" value="${t.key}"><span><i style="background:${hslToHex(210, t.s, t.l)}"></i>${t.name}</span>
    </label>`).join('');
}

// ジャンル（業種）だけは色相の平均で濁らないよう単一選択（radio）にする
const GENRE_CAT = 'ジャンル（業種）';
function buildKeywords() {
  const box = document.getElementById('keywords');
  box.innerHTML = Object.entries(KEYWORDS).map(([cat, items]) => {
    const isGenre = cat === GENRE_CAT;
    // ジャンルは radio ＋ 先頭「指定なし」(value="" = colorfam/tone の既存「指定なし」と同型)
    const none = isGenre ? `
          <label class="chip">
            <input type="radio" name="kwgenre" value="" checked><span>指定なし</span>
          </label>` : '';
    return `
    <div class="kw-group">
      <span>${cat}</span>
      <div class="chips">${none}
        ${Object.keys(items).map(k => isGenre ? `
          <label class="chip">
            <input type="radio" name="kwgenre" value="${cat}/${k}"><span>${k}</span>
          </label>` : `
          <label class="chip">
            <input type="checkbox" value="${cat}/${k}"><span>${k}</span>
          </label>`).join('')}
      </div>
    </div>`;
  }).join('');
}

// --- 基準カラーの操作（カラーピッカーとテキストを同期・ON/OFF切替）---
const basePick = document.getElementById('basePick');
const baseHex  = document.getElementById('baseHex');
const useBase  = document.getElementById('useBase');
const baseBox  = document.getElementById('basecolor');
function syncBaseUI() {
  baseBox.classList.toggle('off', !useBase.checked);
}
useBase.addEventListener('change', () => { syncBaseUI(); render(); });
basePick.addEventListener('input', () => { baseHex.value = basePick.value; render(); });
baseHex.addEventListener('input', () => {
  if (/^#?[0-9a-f]{6}$/i.test(baseHex.value.trim())) {
    basePick.value = baseHex.value.trim().replace(/^#?/, '#');
    render();
  }
});

// --- アクセントカラーの操作（基準カラーと同じ仕組み）---
const accentPick = document.getElementById('accentPick');
const accentHex  = document.getElementById('accentHex');
const useAccent  = document.getElementById('useAccent');
const accentBox  = document.getElementById('accentcolor');
function syncAccentUI() {
  accentBox.classList.toggle('off', !useAccent.checked);
}
useAccent.addEventListener('change', () => { syncAccentUI(); render(); });
accentPick.addEventListener('input', () => { accentHex.value = accentPick.value; render(); });
accentHex.addEventListener('input', () => {
  if (/^#?[0-9a-f]{6}$/i.test(accentHex.value.trim())) {
    accentPick.value = accentHex.value.trim().replace(/^#?/, '#');
    render();
  }
});

// --- 背景カラーの操作（ピッカー・テキスト・プリセット・ON/OFF）---
const bgPick = document.getElementById('bgPick');
const bgHex  = document.getElementById('bgHex');
const useBg  = document.getElementById('useBg');
const bgBox  = document.getElementById('bgcolor');
const BG_PRESETS = [
  { name: '白',          hex: '#ffffff' },
  { name: 'オフホワイト', hex: '#faf8f3' },
  { name: 'ベージュ',     hex: '#f2e9d8' },
  { name: 'ライトグレー', hex: '#eef0f2' },
  { name: 'ダーク',       hex: '#1e2126' },
];
document.getElementById('bgPresets').innerHTML = BG_PRESETS.map(p =>
  `<button type="button" data-hex="${p.hex}"><i style="background:${p.hex}"></i>${p.name}</button>`).join('');
function syncBgUI() { bgBox.classList.toggle('off', !useBg.checked); }
function setBg(hex) { bgPick.value = hex; bgHex.value = hex; }
useBg.addEventListener('change', () => { syncBgUI(); render(); });
bgPick.addEventListener('input', () => { bgHex.value = bgPick.value; render(); });
bgHex.addEventListener('input', () => {
  if (/^#?[0-9a-f]{6}$/i.test(bgHex.value.trim())) {
    bgPick.value = bgHex.value.trim().replace(/^#?/, '#');
    render();
  }
});
document.getElementById('bgPresets').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  setBg(btn.dataset.hex);
  useBg.checked = true; syncBgUI();
  render();
});

/* ===== カラーチップの微調整モーダル ======================================
   チップをクリック → H/S/L スライダーとHEX入力でその色だけを編集する。
   編集は currentPatterns に直接反映され、モック・比率バー・可読性バッジも
   連動して更新される。「元に戻す」は生成直後のスナップショットへ戻す。 */
let editing = null; // { pi: パターン番号, ri: 役割番号, key: 'main'等 }
const edOverlay = document.getElementById('editor');
const edH = document.getElementById('edH');
const edS = document.getElementById('edS');
const edL = document.getElementById('edL');
const edHexInput = document.getElementById('edHex');

function openEditor(pi, ri) {
  editing = { pi, ri, key: ROLE_KEYS[ri] };
  document.getElementById('edTitle').textContent =
    `${ROLE_NAMES[ri]}カラーを調整（${currentPatterns[pi].name}）`;
  syncEditorSliders();
  refreshEditorUI();
  edOverlay.hidden = false;
}
function closeEditor() {
  editing = null;
  edOverlay.hidden = true;
}
function syncEditorSliders() {
  const c = currentPatterns[editing.pi][editing.key];
  edH.value = Math.round(c[0]);
  edS.value = Math.round(c[1] * 100);
  edL.value = Math.round(c[2] * 100);
}
function refreshEditorUI(skipHexInput) {
  const c = currentPatterns[editing.pi][editing.key];
  const hex = hslToHex(c[0], c[1], c[2]);
  document.getElementById('edHv').textContent = `${Math.round(c[0])}°`;
  document.getElementById('edSv').textContent = Math.round(c[1] * 100);
  document.getElementById('edLv').textContent = Math.round(c[2] * 100);
  const swEl = document.getElementById('edSwatch');
  swEl.style.background = hex;
  swEl.style.color = textOn(hex);
  document.getElementById('edHexLabel').textContent = hex.toUpperCase();
  if (!skipHexInput) edHexInput.value = hex; // HEX入力中はカーソルを飛ばさない
}
[edH, edS, edL].forEach(el => el.addEventListener('input', () => {
  if (!editing) return;
  currentPatterns[editing.pi][editing.key] = [+edH.value, +edS.value / 100, +edL.value / 100];
  paintOutput();
  refreshEditorUI();
}));
edHexInput.addEventListener('input', () => {
  if (!editing) return;
  const hsl = hexToHsl(edHexInput.value);
  if (!hsl) return;
  currentPatterns[editing.pi][editing.key] = [hsl.h, hsl.s, hsl.l];
  syncEditorSliders();
  paintOutput();
  refreshEditorUI(true);
});
document.getElementById('edCopy').addEventListener('click', (e) => {
  if (!editing) return;
  const c = currentPatterns[editing.pi][editing.key];
  navigator.clipboard?.writeText(hslToHex(c[0], c[1], c[2]));
  e.target.textContent = '✓ コピーしました';
  setTimeout(() => { e.target.textContent = 'HEXをコピー'; }, 900);
});
document.getElementById('edReset').addEventListener('click', () => {
  if (!editing) return;
  currentPatterns[editing.pi][editing.key] = pristinePatterns[editing.pi][editing.key].slice();
  syncEditorSliders();
  paintOutput();
  refreshEditorUI();
});
document.getElementById('edClose').addEventListener('click', closeEditor);
// 背景で「押し始めた」ときだけ閉じる。click判定だと、スライダーをドラッグして
// モーダル外で指を離した場合に背景クリック扱いになり、誤って閉じてしまう。
edOverlay.addEventListener('pointerdown', (e) => { if (e.target === edOverlay) closeEditor(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEditor(); });

buildColors();
buildTones();
buildKeywords();
syncBaseUI();
syncAccentUI();
syncBgUI();
syncMetallicUI();

// カラー選択が変わったら色味サブ選択の表示を同期する（委譲リスナー）
document.getElementById('colorfam').addEventListener('change', syncMetallicUI);

// --- トーンチップ: 選ぶとスライダー3本をプリセット位置へ動かす ---
document.getElementById('tones').addEventListener('change', (e) => {
  const t = TONES.find(x => x.key === e.target.value);
  if (t) {
    document.getElementById('light').value = t.light;
    document.getElementById('vivid').value = t.vivid;
    document.getElementById('muted').value = t.muted;
  } else {
    // 「指定なし」= トーンの効果をクリア
    ['light', 'vivid', 'muted'].forEach(id => document.getElementById(id).value = 0);
  }
  render();
});
// スライダーを手で動かしたらトーン選択を外す（プリセットと食い違うため）
['light', 'vivid', 'muted'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => {
    document.querySelector('input[name=tone][value=""]').checked = true;
  }));

// --- 「割合を決める」のスライダーだけを初期値に戻す ---
// 左右対称のスライダーは中央(0)へ。「くすみ」のみ一方通行のため左端(0=純色)へ。
document.getElementById('sliderReset').addEventListener('click', () => {
  ['warm','gender','formal','light','vivid','muted','contrast','age','season']
    .forEach(id => document.getElementById(id).value = 0);
  document.querySelector('input[name=tone][value=""]').checked = true; // トーンのプリセットも解除
  render();
});
// 「配色を生成」= シードを更新して別案へシャッフル
document.getElementById('gen').addEventListener('click', () => {
  seed = Math.floor(Math.random() * 1e9) || 1;
  render();
});
document.getElementById('reset').addEventListener('click', () => {
  document.querySelectorAll('#keywords input').forEach(el => el.checked = false);
  document.querySelector('input[name=kwgenre][value=""]').checked = true; // ジャンルは「指定なし」へ
  document.querySelector('input[name=colorfam][value=""]').checked = true;
  document.querySelector('input[name=mv-gold][value="yellow"]').checked = true;  // 色味は先頭値へ
  document.querySelector('input[name=mv-silver][value="cool"]').checked = true;
  syncMetallicUI();
  ['warm','gender','formal','light','vivid','muted','contrast','age','season']
    .forEach(id => document.getElementById(id).value = 0);
  useBase.checked = false; syncBaseUI();
  useAccent.checked = false; syncAccentUI();
  useBg.checked = false; syncBgUI();
  document.getElementById('sameHue').checked = false;
  document.querySelector('input[name=tone][value=""]').checked = true;
  document.querySelector('input[name=dispmode][value="auto"]').checked = true;
  document.getElementById('cvdCheck').checked = false;
  render();
});
document.getElementById('sameHue').addEventListener('change', render);
// 入力が変わったら自動で更新（生成ボタンを押さなくても反映）
// ※ .panel 内に限定する。モーダル(#editor)内のH/S/Lスライダーも .slider 構造を
//    使っているため、限定しないと微調整のたびに再生成が走りモーダルが閉じてしまう
document.querySelectorAll('#colorfam input, #keywords input, .panel .slider input').forEach(el =>
  el.addEventListener('input', render));
document.querySelectorAll('#dispmode input').forEach(el => el.addEventListener('change', render));
document.getElementById('cvdCheck').addEventListener('change', render);
</script>
</body>
